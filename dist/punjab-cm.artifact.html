<title>Punjab Chief Minister</title>
<style>
/* src/ui/styles.css */
/* ------------------------------------------------------------------
   Punjab Chief Minister — election strategy game

   Type: Archivo carries the numbers and headlines — the heavy, slightly
   condensed grotesque of election-night broadcast graphics, where a seat
   count has to read across a room. IBM Plex Sans runs the interface: a
   technical face that stays legible at 10px in a dense control panel.
   ------------------------------------------------------------------ */
@import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap');

:root {
  --bg: #0a0e17;
  --bg-2: #0e1420;
  --panel: #121a28;
  --panel-2: #162030;
  --card: #172132;
  --line: #23304a;
  --line-soft: #1b2436;
  --ink: #e8edf7;
  --ink-2: #9fadc6;
  --ink-3: #6b7994;
  --accent: #f0a020;
  --good: #37c98a;
  --bad: #ef5f6b;
  --warn: #e8b230;
  --radius: 12px;
  --radius-sm: 8px;
  --shadow: 0 18px 46px rgba(0, 0, 0, 0.5);
  --font: "IBM Plex Sans", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --font-display: "Archivo", "Segoe UI Semibold", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
  --mono: "SF Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
}

* { box-sizing: border-box; }

html, body {
  height: 100%;
  margin: 0;
}

body {
  font-family: var(--font);
  background:
    radial-gradient(1100px 700px at 12% -10%, #16233c 0%, transparent 62%),
    radial-gradient(900px 600px at 105% 8%, #1d1a33 0%, transparent 58%),
    var(--bg);
  color: var(--ink);
  -webkit-font-smoothing: antialiased;
  overflow: hidden;
}

body[data-screen="setup"] { overflow: auto; }

#app { height: 100%; }

.screen {
  height: 100%;
  display: flex;
  flex-direction: column;
  position: relative;
}

body[data-screen="setup"] .screen { height: auto; min-height: 100%; }

/* ---------------------------------------------------------- buttons */

.btn {
  appearance: none;
  border: 1px solid var(--line);
  background: linear-gradient(180deg, #1c2739, #16202f);
  color: var(--ink);
  font: inherit;
  font-weight: 600;
  font-size: 13px;
  padding: 9px 16px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  transition: border-color .15s, background .15s, transform .08s;
  white-space: nowrap;
}
.btn:hover { border-color: #35486e; background: linear-gradient(180deg, #223049, #1a2537); }
.btn:active { transform: translateY(1px); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.btn-primary {
  background: linear-gradient(180deg, #2f74e8, #2159c4);
  border-color: #4d8bf5;
  color: #fff;
  box-shadow: 0 6px 18px rgba(33, 89, 196, .34);
}
.btn-primary:hover { background: linear-gradient(180deg, #3d81f2, #2a63d0); border-color: #6ba1ff; }

.btn-primary.is-election {
  background: linear-gradient(180deg, #e0932a, #c1761c);
  border-color: #f5b350;
  box-shadow: 0 6px 20px rgba(193, 118, 28, .38);
}

.btn-ghost { background: transparent; border-color: var(--line-soft); color: var(--ink-2); }
.btn-ghost:hover { color: var(--ink); border-color: var(--line); background: rgba(255,255,255,.03); }

.btn-large { padding: 12px 26px; font-size: 15px; }
.btn-small { padding: 6px 11px; font-size: 12px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }

.link-btn {
  background: none; border: 0; padding: 0;
  color: var(--ink-2); font: inherit; cursor: pointer;
  border-bottom: 1px dashed var(--line);
}
.link-btn:hover { color: var(--ink); }

/* ---------------------------------------------------------- HUD */

.hud {
  display: grid;
  grid-template-columns: minmax(200px, 1fr) minmax(320px, 620px) minmax(240px, 1fr);
  gap: 20px;
  align-items: center;
  padding: 12px 20px;
  background: linear-gradient(180deg, rgba(14,20,32,.95), rgba(12,17,27,.86));
  border-bottom: 1px solid var(--line-soft);
  backdrop-filter: blur(8px);
  z-index: 20;
  min-width: 0;
}
.hud > *, .hud-left, .hud-right, .hud-meter { min-width: 0; }
.seat-meter, .meter-head, .meter-primary, .meter-need, .stat-row { min-width: 0; }
.meter-need-label { white-space: normal; }

.hud-left { display: flex; align-items: center; gap: 12px; min-width: 0; }

.hud-title { display: flex; flex-direction: column; min-width: 0; }
.hud-election {
  font-size: 15px; font-weight: 700; letter-spacing: -.2px;
  white-space: nowrap;
}
.hud-sub {
  font-size: 12px; color: var(--ink-3);
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}

.phase-pill {
  font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .07em;
  padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--line); color: var(--ink-2);
  background: rgba(255,255,255,.03);
  white-space: nowrap;
}
.phase-pill.phase-final { color: #ffd08a; border-color: #6a4f21; background: rgba(224,147,42,.12); }
.phase-pill.phase-electionDay,
.phase-pill.phase-results { color: #9fd4ff; border-color: #2c517d; background: rgba(47,116,232,.14); }

.hud-right { display: flex; align-items: center; justify-content: flex-end; gap: 16px; }
.stat-row { display: flex; gap: 16px; }
.stat { display: flex; flex-direction: column; align-items: flex-end; line-height: 1.15; }
.stat-label { font-size: 10px; text-transform: uppercase; letter-spacing: .08em; color: var(--ink-3); }
.stat-value { font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.stat-money .stat-value { color: var(--accent); }
.stat-sub { font-size: 11px; color: var(--ink-3); }
.hud-buttons { display: flex; gap: 8px; }

/* seat meter */

.seat-meter { display: flex; flex-direction: column; gap: 7px; }
.meter-head { display: flex; align-items: baseline; justify-content: space-between; gap: 14px; }
.meter-primary { display: flex; align-items: baseline; gap: 8px; }
.meter-number {
  font-size: 30px; font-weight: 800; letter-spacing: -1px;
  font-variant-numeric: tabular-nums; line-height: 1;
}
.meter-of { font-size: 12px; color: var(--ink-3); }
.meter-need { display: flex; align-items: baseline; gap: 7px; }
.meter-need-value {
  font-size: 20px; font-weight: 800; color: var(--warn);
  font-variant-numeric: tabular-nums;
}
.meter-need-label { font-size: 11px; color: var(--ink-3); }
.meter-head.is-majority .meter-need-value { color: var(--good); }

.meter-track {
  position: relative; height: 12px; border-radius: 999px;
  background: #1a2437; border: 1px solid var(--line-soft); overflow: visible;
}
.meter-fill {
  position: absolute; inset: 0 auto 0 0; border-radius: 999px;
  transition: width .45s cubic-bezier(.22,.61,.36,1);
  box-shadow: 0 0 18px -2px currentColor;
}
.meter-marker {
  position: absolute; top: -5px; bottom: -5px; width: 2px;
  background: #ffffff; opacity: .85; border-radius: 2px;
  transform: translateX(-1px);
}
.meter-marker-label {
  position: absolute; top: -16px; left: 50%; transform: translateX(-50%);
  font-size: 10px; font-weight: 700; color: #fff; opacity: .8;
}
.seat-meter.is-majority .meter-track { box-shadow: 0 0 0 1px rgba(55,201,138,.5); }

/* ---------------------------------------------------------- layout */

.game-main {
  flex: 1;
  display: grid;
  grid-template-columns: minmax(0, 1fr) minmax(340px, 400px);
  min-height: 0;
}

.map-pane {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  min-height: 0;
  border-right: 1px solid var(--line-soft);
}

/* ---------------------------------------------------------- toolbar */

.map-toolbar {
  display: flex; align-items: center; gap: 20px; flex-wrap: wrap;
  padding: 10px 16px;
  border-bottom: 1px solid var(--line-soft);
  background: rgba(10,14,23,.5);
}
.toolbar-section { display: flex; align-items: center; gap: 9px; }
.toolbar-label {
  font-size: 10px; text-transform: uppercase; letter-spacing: .09em; color: var(--ink-3);
}
.toggle-group {
  display: inline-flex; border: 1px solid var(--line-soft); border-radius: 999px;
  overflow: hidden; background: rgba(255,255,255,.02);
}
.toggle {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  font: inherit; font-size: 12px; font-weight: 600; color: var(--ink-3);
  padding: 6px 13px; transition: color .15s, background .15s;
}
.toggle + .toggle { border-left: 1px solid var(--line-soft); }
.toggle:hover { color: var(--ink); }
.toggle.is-active { background: #22304a; color: #fff; }

/* ---------------------------------------------------------- map */

.map-root { position: relative; flex: 1; min-height: 0; overflow: hidden; }

.map-svg {
  width: 100%; height: 100%; display: block;
  cursor: grab; touch-action: none;
}
.map-svg.is-dragging { cursor: grabbing; }

.map-outline {
  fill: #0d1422;
  stroke: #2b3a58;
  stroke-width: 2.4;
  vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 0 26px rgba(50, 90, 160, .32));
}

.map-cell {
  stroke: #0a0e17;
  stroke-width: 1;
  vector-effect: non-scaling-stroke;
  cursor: pointer;
  transition: fill-opacity .3s, fill .3s;
}
.map-cell.is-hovered { stroke: #ffffff; stroke-width: 1.8; }
.map-cell.is-dimmed { fill-opacity: .12 !important; }
.map-cell.is-selected { stroke: #ffffff; stroke-width: 2; }

.map-district-border {
  fill: none;
  stroke: rgba(228, 238, 255, .3);
  stroke-width: 1.4;
  stroke-linejoin: round;
  vector-effect: non-scaling-stroke;
  pointer-events: none;
}

.map-selection {
  fill: none; stroke: #fff; stroke-width: 2.6;
  vector-effect: non-scaling-stroke; pointer-events: none;
  filter: drop-shadow(0 0 6px rgba(255,255,255,.7));
}
.map-district-focus {
  fill: none; stroke: var(--accent); stroke-width: 2.4;
  vector-effect: non-scaling-stroke; pointer-events: none;
}

.map-labels { pointer-events: none; }
.map-labels { --map-k: 1; }
.map-district-label {
  fill: rgba(226, 236, 255, .72);
  font-size: calc(14px / var(--map-k));
  font-weight: 700;
  letter-spacing: .02em;
  paint-order: stroke;
  stroke: rgba(6, 10, 18, .85);
  stroke-width: calc(3.5px / var(--map-k));
  stroke-linejoin: round;
  opacity: 0;
  transition: opacity .2s;
}
.map-labels.show-districts .map-district-label { opacity: 1; }
.map-seat-label {
  fill: rgba(255,255,255,.82);
  font-size: calc(11px / var(--map-k));
  font-weight: 700;
  paint-order: stroke;
  stroke: rgba(6,10,18,.72);
  stroke-width: calc(2.6px / var(--map-k));
  opacity: 0;
  transition: opacity .2s;
}
.map-labels.show-seats .map-seat-label { opacity: 1; }
.map-labels.show-seats.show-districts .map-district-label { opacity: .55; }

.map-controls {
  position: absolute; right: 14px; top: 14px;
  display: flex; flex-direction: column; gap: 6px; align-items: stretch;
}
.map-btn {
  width: 34px; height: 34px; border-radius: 9px;
  border: 1px solid var(--line); background: rgba(18,26,40,.9);
  color: var(--ink); font-size: 17px; font-weight: 700; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(6px);
}
.map-btn:hover { border-color: #3a5079; background: rgba(28,40,60,.95); }
.map-btn-wide { width: 34px; height: 26px; font-size: 9.5px; letter-spacing: .02em; }
.map-zoom-level {
  font-size: 10px; color: var(--ink-3); text-align: center;
  font-variant-numeric: tabular-nums;
}

.map-legend {
  display: flex; flex-wrap: wrap; gap: 6px 16px; align-items: center;
  padding: 9px 16px;
  border-top: 1px solid var(--line-soft);
  background: rgba(10,14,23,.5);
  font-size: 11px; color: var(--ink-2);
}
.legend-item { display: inline-flex; align-items: center; gap: 6px; }
.legend-swatch { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }

/* tooltip */

.map-tooltip {
  position: absolute; top: 0; left: 0;
  width: 226px; padding: 10px 12px;
  background: rgba(13,19,31,.97);
  border: 1px solid var(--line);
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  pointer-events: none; opacity: 0;
  transition: opacity .12s;
  z-index: 12;
}
.map-tooltip.is-visible { opacity: 1; }
.tt-head { display: flex; align-items: center; gap: 7px; font-size: 13px; }
.tt-num { color: var(--ink-3); font-size: 11px; font-variant-numeric: tabular-nums; }
.tt-tag {
  font-size: 9px; font-weight: 700; padding: 1px 5px; border-radius: 4px;
  background: #2a3550; color: var(--ink-2);
}
.tt-sub { font-size: 11px; color: var(--ink-3); margin-top: 2px; }
.tt-bars { margin-top: 8px; display: flex; flex-direction: column; gap: 4px; }
.tt-bar-row { display: grid; grid-template-columns: 32px 1fr 34px; gap: 6px; align-items: center; }
.tt-party { font-size: 10px; font-weight: 700; color: var(--ink-2); }
.tt-track { height: 6px; background: #1b2740; border-radius: 3px; overflow: hidden; }
.tt-fill { display: block; height: 100%; border-radius: 3px; }
.tt-val { font-size: 10px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }
.tt-foot { margin-top: 8px; font-size: 11px; font-weight: 700; }

/* rating colours */
.rating-safe { color: #6fe3ac; }
.rating-likely { color: #8fd0ff; }
.rating-lean { color: #ffc978; }
.rating-tossup { color: #ff9d8a; }

/* ---------------------------------------------------------- panel */

.panel {
  display: flex; flex-direction: column; min-height: 0;
  background: linear-gradient(180deg, rgba(18,26,40,.72), rgba(13,19,30,.72));
}

.panel-tabs {
  display: grid; grid-template-columns: repeat(4, 1fr);
  border-bottom: 1px solid var(--line-soft);
}
.panel-tab {
  appearance: none; border: 0; background: transparent; cursor: pointer;
  font: inherit; font-size: 12px; font-weight: 700; color: var(--ink-3);
  padding: 12px 6px; border-bottom: 2px solid transparent;
  transition: color .15s, border-color .15s;
}
.panel-tab:hover { color: var(--ink-2); }
.panel-tab.is-active { color: var(--ink); border-bottom-color: var(--accent); }

.panel-body {
  flex: 1; min-height: 0; overflow-y: auto;
  padding: 16px 16px 26px;
  display: flex; flex-direction: column; gap: 14px;
  scrollbar-width: thin;
  scrollbar-color: #2b3a58 transparent;
}
.panel-body::-webkit-scrollbar { width: 9px; }
.panel-body::-webkit-scrollbar-thumb { background: #26344f; border-radius: 9px; }
.panel-body::-webkit-scrollbar-track { background: transparent; }

.panel-intro { margin: 0; font-size: 12px; color: var(--ink-3); }

.sub-head {
  font-size: 10px; text-transform: uppercase; letter-spacing: .1em;
  color: var(--ink-3); font-weight: 700;
  padding-top: 4px; border-top: 1px solid var(--line-soft);
}

.empty-state { padding: 30px 6px; text-align: center; color: var(--ink-3); }
.empty-state h2 { font-size: 16px; margin: 0 0 8px; color: var(--ink-2); }
.empty-state p { margin: 0; font-size: 13px; line-height: 1.5; }

.muted-note { margin: 0; font-size: 11.5px; color: var(--ink-3); line-height: 1.5; }

/* seat / district header */

.seat-head { display: flex; flex-direction: column; gap: 4px; }
.seat-title { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.seat-title h2 { margin: 0; font-size: 20px; letter-spacing: -.3px; }
.seat-num { font-size: 12px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.tag {
  font-size: 9.5px; font-weight: 700; padding: 2px 6px; border-radius: 4px;
  background: #2a3550; color: var(--ink-2); letter-spacing: .04em;
}
.seat-sub { font-size: 12px; color: var(--ink-3); }

.seat-rating { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: 12px; font-weight: 700;
  padding: 5px 10px; border-radius: 999px;
  border: 1px solid var(--line); background: rgba(255,255,255,.03);
}
.chip-dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.seat-gap { font-size: 12px; color: var(--ink-2); }

.share-bars { display: flex; flex-direction: column; gap: 5px; }
.share-row { display: grid; grid-template-columns: 38px 1fr 44px; gap: 8px; align-items: center; }
.share-row.is-you .share-name { color: var(--ink); }
.share-name { font-size: 11px; font-weight: 700; color: var(--ink-3); }
.share-track { height: 9px; background: #1a2438; border-radius: 4px; overflow: hidden; }
.share-fill { display: block; height: 100%; border-radius: 4px; transition: width .4s; }
.share-val { font-size: 11.5px; text-align: right; font-variant-numeric: tabular-nums; color: var(--ink-2); }

.issue-chips { display: flex; flex-direction: column; gap: 6px; }
.issue-chip {
  display: grid; grid-template-columns: 1fr 84px; gap: 10px; align-items: center;
  font-size: 12px; color: var(--ink-2);
}
.issue-chip-track { height: 6px; background: #1a2438; border-radius: 3px; overflow: hidden; }
.issue-chip-fill { display: block; height: 100%; background: linear-gradient(90deg,#3f7bf0,#8fd0ff); }

.kv-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; }
.kv-grid-4 { grid-template-columns: repeat(4, 1fr); }
.kv { display: flex; flex-direction: column; gap: 1px; }
.kv-k { font-size: 10px; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); }
.kv-v { font-size: 13.5px; font-weight: 700; }

.district-momentum {
  display: flex; align-items: baseline; gap: 8px;
  padding: 8px 11px; border-radius: var(--radius-sm);
  border: 1px solid var(--line-soft); background: rgba(255,255,255,.02);
}
.district-momentum.good .kv-v { color: var(--good); }
.district-momentum.bad .kv-v { color: var(--bad); }

/* seat list */

.seat-list { display: flex; flex-direction: column; gap: 3px; }
.seat-list-row {
  display: grid; grid-template-columns: 26px 1fr auto 34px; gap: 8px; align-items: center;
  appearance: none; border: 1px solid transparent; background: rgba(255,255,255,.02);
  border-radius: 7px; padding: 7px 9px; cursor: pointer; text-align: left;
  font: inherit; color: var(--ink-2);
}
.seat-list-row:hover { background: rgba(255,255,255,.05); border-color: var(--line-soft); }
.seat-list-row.is-selected { border-color: var(--accent); background: rgba(240,160,32,.08); }
.seat-list-row.is-yours .slr-name { color: var(--ink); }
.slr-num { font-size: 10.5px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.slr-name { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slr-band { font-size: 10.5px; font-weight: 700; }
.slr-leader { font-size: 11px; font-weight: 700; text-align: right; }

/* ---------------------------------------------------------- actions */

.action-list { display: flex; flex-direction: column; gap: 7px; }

.action-card {
  display: grid; grid-template-columns: 30px 1fr auto; gap: 11px; align-items: start;
  appearance: none; text-align: left; font: inherit; cursor: pointer;
  padding: 11px 12px;
  border: 1px solid var(--line-soft);
  border-radius: var(--radius-sm);
  background: linear-gradient(180deg, rgba(30,42,64,.5), rgba(20,29,45,.5));
  color: var(--ink);
  transition: border-color .15s, background .15s, transform .08s;
}
.action-card:hover:not(.is-disabled) {
  border-color: #3a5079;
  background: linear-gradient(180deg, rgba(38,54,82,.6), rgba(24,35,54,.6));
}
.action-card:active:not(.is-disabled) { transform: translateY(1px); }
.action-card.is-disabled { opacity: .42; cursor: not-allowed; }

.action-icon { font-size: 19px; line-height: 1.2; }
.action-main { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.action-label { font-size: 13.5px; font-weight: 700; display: flex; align-items: center; gap: 7px; }
.action-uses {
  font-size: 9.5px; font-weight: 700; color: var(--warn);
  border: 1px solid rgba(232,178,48,.35); border-radius: 4px; padding: 1px 5px;
}
.action-blurb { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
.action-meta { display: flex; gap: 8px; font-size: 10px; color: var(--ink-3); margin-top: 2px; }
.action-scope { color: var(--ink-2); }
.action-tempo {
  border: 1px solid var(--line-soft); border-radius: 4px; padding: 0 5px;
}
.action-cost { display: flex; flex-direction: column; align-items: flex-end; gap: 3px; }
.action-cost-value {
  font-size: 13px; font-weight: 800; color: var(--accent);
  font-variant-numeric: tabular-nums; white-space: nowrap;
}
.action-why { font-size: 9.5px; color: var(--ink-3); text-align: right; max-width: 96px; line-height: 1.3; }

/* issue picker */

.issue-picker { display: flex; flex-direction: column; gap: 12px; }
.picker-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.picker-head strong { font-size: 15px; }
.picker-hint { margin: 0; font-size: 12px; color: var(--ink-3); line-height: 1.5; }
.issue-list { display: flex; flex-direction: column; gap: 6px; }
.issue-row {
  display: grid; grid-template-columns: 26px 1fr; gap: 10px; align-items: center;
  appearance: none; text-align: left; font: inherit; cursor: pointer; color: var(--ink);

/**
 * Data access helpers.
 * ------------------------------------------------------------------
 * Thin, cached indexes over the reference data so the engine and UI never
 * scan arrays in a hot loop. State-scoped throughout, so nothing here
 * assumes a particular state is loaded.
 */
window.PG = window.PG || {};
PG.index = (function () {
  'use strict';

  var cache = {};

  function build(stateId) {
    var st = PG.getState(stateId);
    var seatDefs = st.seats();
    var geo = st.geometry();

    var byNum = {};
    seatDefs.forEach(function (d) {
      byNum[d.num] = d;
    });

    var geoByNum = {};
    geo.seats.forEach(function (g) {
      geoByNum[g.num] = g;
    });

    var districtOrder = Object.keys(st.districts()).sort(function (a, b) {
      var da = st.districts()[a];
      var db = st.districts()[b];
      if (da.region !== db.region) return da.region.localeCompare(db.region);
      return a.localeCompare(b);
    });

    return {
      stateDef: st,
      seatDefs: seatDefs,
      byNum: byNum,
      geoByNum: geoByNum,
      districts: st.districts(),
      regions: st.regions(),
      districtOrder: districtOrder,
      total: seatDefs.length,
      majority: st.majority(seatDefs.length),
    };
  }

  function get(stateId) {
    var id = stateId || PG.DEFAULT_STATE;
    if (!cache[id]) cache[id] = build(id);
    return cache[id];
  }

  return {
    get: get,
    seatDef: function (stateId, num) {
      return get(stateId).byNum[num];
    },
    seatGeo: function (stateId, num) {
      return get(stateId).geoByNum[num];
    },
    district: function (stateId, name) {
      return get(stateId).districts[name];
    },
    districtOrder: function (stateId) {
      return get(stateId).districtOrder;
    },
    majority: function (stateId) {
      return get(stateId).majority;
    },
    total: function (stateId) {
      return get(stateId).total;
    },
  };
})();

/**
 * Deterministic randomness.
 * ------------------------------------------------------------------
 * Everything random in the game runs through here so that a saved game
 * reloads identically and a seed reproduces a whole campaign. No engine
 * code is allowed to call Math.random directly.
 */
window.PG = window.PG || {};
PG.rng = (function () {
  'use strict';

  // 32-bit string hash, used to derive stable sub-seeds from labels.
  function hashString(str) {
    var h = 2166136261 >>> 0;
    for (var i = 0; i < str.length; i++) {
      h ^= str.charCodeAt(i);
      h = Math.imul(h, 16777619) >>> 0;
    }
    return h >>> 0;
  }

  // mulberry32
  function create(seed) {
    var a = typeof seed === 'string' ? hashString(seed) : seed >>> 0;
    var spare = null;

    var api = {
      next: function () {
        a = (a + 0x6d2b79f5) >>> 0;
        var t = a;
        t = Math.imul(t ^ (t >>> 15), t | 1);
        t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      },
      /** Uniform float in [lo, hi). */
      range: function (lo, hi) {
        return lo + api.next() * (hi - lo);
      },
      /** Integer in [lo, hi]. */
      int: function (lo, hi) {
        return Math.floor(lo + api.next() * (hi - lo + 1));
      },
      /** Standard normal, Box-Muller with a cached spare. */
      normal: function () {
        if (spare !== null) {
          var s = spare;
          spare = null;
          return s;
        }
        var u = 0;
        var v = 0;
        while (u === 0) u = api.next();
        while (v === 0) v = api.next();
        var r = Math.sqrt(-2 * Math.log(u));
        var th = 2 * Math.PI * v;
        spare = r * Math.sin(th);
        return r * Math.cos(th);
      },
      /** Normal clamped to +/- 2.5 sigma, so nothing goes wild. */
      gauss: function (sigma) {
        var n = api.normal();
        if (n > 2.5) n = 2.5;
        if (n < -2.5) n = -2.5;
        return n * (sigma === undefined ? 1 : sigma);
      },
      pick: function (arr) {
        return arr[Math.floor(api.next() * arr.length)];
      },
      shuffle: function (arr) {
        var out = arr.slice();
        for (var i = out.length - 1; i > 0; i--) {
          var j = Math.floor(api.next() * (i + 1));
          var t = out[i];
          out[i] = out[j];
          out[j] = t;
        }
        return out;
      },
      chance: function (p) {
        return api.next() < p;
      },
    };
    return api;
  }

  /**
   * A stable pseudo-random value in [0,1) derived from a seed and any number
   * of labels. Used for things that must be identical every time they are
   * recomputed (polling fog, for example) without storing them.
   */
  function stable(seed) {
    var key = String(seed);
    for (var i = 1; i < arguments.length; i++) key += '|' + arguments[i];
    var h = hashString(key);
    h = Math.imul(h ^ (h >>> 15), h | 1) >>> 0;
    h ^= h + (Math.imul(h ^ (h >>> 7), h | 61) >>> 0);
    return ((h ^ (h >>> 14)) >>> 0) / 4294967296;
  }

  /** Stable value shaped like a clamped normal, mean 0. */
  function stableGauss(sigma) {
    var args = Array.prototype.slice.call(arguments, 1);
    var a = stable.apply(null, args.concat(['a']));
    var b = stable.apply(null, args.concat(['b']));
    if (a === 0) a = 1e-9;
    var n = Math.sqrt(-2 * Math.log(a)) * Math.cos(2 * Math.PI * b);
    if (n > 2.5) n = 2.5;
    if (n < -2.5) n = -2.5;
    return n * sigma;
  }

  function randomSeed() {
    // The only entry point allowed to be non-deterministic: picking a new seed.
    return (Math.floor(Math.random() * 0xffffffff) >>> 0).toString(36);
  }

  return {
    create: create,
    hashString: hashString,
    stable: stable,
    stableGauss: stableGauss,
    randomSeed: randomSeed,
  };
})();

/**
 * The election model.
 * ------------------------------------------------------------------
 * Two jobs:
 *   1. generateLandscape() -- build a plausible, seeded political map for a
 *      state: base support per party per seat, issue salience, incumbents,
 *      candidate quality. Run once at the start of a campaign.
 *   2. project() / simulate() -- turn the live game state into vote shares,
 *      seat ratings and, on election day, actual winners.
 *
 * No DOM, no UI, no storage. Everything here is a pure function of the game
 * state plus the seed.
 */
window.PG = window.PG || {};
PG.model = (function () {
  'use strict';

  var CLAMP_MIN = 0.6; // a party never drops below this share

  function clamp(v, lo, hi) {
    return v < lo ? lo : v > hi ? hi : v;
  }

  function normalise(raw) {
    var total = 0;
    var out = {};
    var k;
    for (k in raw) {
      out[k] = Math.max(CLAMP_MIN, raw[k]);
      total += out[k];
    }
    for (k in out) out[k] = (out[k] / total) * 100;
    return out;
  }

  /* ------------------------------------------------------------------
   * 1. Landscape generation
   * ---------------------------------------------------------------- */

  /**
   * Build the starting political map. Returns { seats, meta } where seats is
   * keyed by constituency number. Deterministic for a given seed.
   */
  function generateLandscape(stateDef, seed, difficulty, playerPartyId) {
    var rng = PG.rng.create(seed + ':landscape');
    var seatDefs = stateDef.seats();
    var districts = stateDef.districts();
    var tuning = stateDef.tuning;
    var diff = stateDef.difficulties[difficulty];
    var parties = PG.PARTIES;
    var issues = PG.ISSUES;

    // A per-district shock, so neighbouring seats lean the same way and the
    // map has real strongholds rather than 117 independent coin flips.
    var districtShock = {};
    Object.keys(districts).forEach(function (dName) {
      districtShock[dName] = {};
      parties.forEach(function (p) {
        districtShock[dName][p.id] = rng.gauss(tuning.districtSpread);
      });
    });

    var seats = {};
    seatDefs.forEach(function (def) {
      var base = {};
      var issueSalience = {};
      var candidate = {};
      var totalSal = 0;

      issues.forEach(function (issue) {
        var s = issue.salience[def.settlement] * (1 + rng.gauss(0.16));
        issueSalience[issue.id] = Math.max(0.05, s);
        totalSal += issueSalience[issue.id];
      });
      // Normalise salience so every seat has the same total attention to give.
      issues.forEach(function (issue) {
        issueSalience[issue.id] = (issueSalience[issue.id] / totalSal) * issues.length;
      });

      // The single issue that dominates local conversation here.
      var localIssue = issues[0].id;
      issues.forEach(function (issue) {
        if (issueSalience[issue.id] > issueSalience[localIssue]) localIssue = issue.id;
      });

      parties.forEach(function (p) {
        var v = p.stateBase;
        v += p.regionLean[def.region] || 0;
        v += p.settlementLean[def.settlement] || 0;
        v += districtShock[def.district][p.id];
        v += rng.gauss(tuning.seatSpread);
        // SC-reserved seats shuffle the pack a little differently.
        if (def.reservation === 'SC') v += rng.gauss(2.0);
        if (p.id === playerPartyId) v += diff.playerBase;
        base[p.id] = Math.max(1.5, v);

        candidate[p.id] = rng.gauss(tuning.candidateSpread);
      });

      base = normalise(base);

      // Sitting member: usually whoever is strongest, sometimes not.
      var ranked = parties
        .map(function (p) {
          return { id: p.id, v: base[p.id] };
        })
        .sort(function (a, b) {
          return b.v - a.v;
        });
      var incumbent = rng.chance(0.72) ? ranked[0].id : ranked[1].id;
      var incumbencyEffect = rng.gauss(tuning.incumbencySpread);

      seats[def.num] = {
        num: def.num,
        base: base,
        issueSalience: issueSalience,
        localIssue: localIssue,
        incumbent: incumbent,
        incumbencyEffect: incumbencyEffect,
        candidate: candidate,
        camp: {},
        ground: {},
        mods: [],
        spend: {},
        visited: 0,
      };
    });

    return { seats: seats, seed: seed };
  }

  /* ------------------------------------------------------------------
   * 2. Support projection
   * ---------------------------------------------------------------- */

  // Mean party credibility per issue, so alignment is a relative advantage.
  var meanCred = (function () {
    var m = {};
    PG.ISSUES.forEach(function (issue) {
      var t = 0;
      PG.PARTIES.forEach(function (p) {
        t += p.credibility[issue.id] || 0.5;
      });
      m[issue.id] = t / PG.PARTIES.length;
    });
    return m;
  })();

  function issueAlignment(party, seat) {
    var total = 0;
    var weight = 0;
    PG.ISSUES.forEach(function (issue) {
      var sal = seat.issueSalience[issue.id];
      total += sal * ((party.credibility[issue.id] || 0.5) - meanCred[issue.id]);
      weight += sal;
    });
    return weight ? total / weight : 0;
  }

  /** Diminishing-returns curve from campaign points to vote share. */
  function campaignBonus(points, tuning) {
    if (!points || points <= 0) return 0;
    return tuning.campaignMaxSwing * (1 - Math.exp(-points / tuning.campaignScale));
  }

  /**
   * True underlying vote shares for one seat. This is what the election is
   * actually decided on; the player only ever sees a fogged version.
   */
  function seatShares(game, seatNum) {
    var stateDef = PG.getState(game.stateId);
    var tuning = stateDef.tuning;
    var def = PG.index.seatDef(game.stateId, seatNum);
    var seat = game.seats[seatNum];
    var raw = {};

    PG.PARTIES.forEach(function (p) {
      var v = seat.base[p.id];

      var pts = (seat.camp[p.id] || 0) + (seat.ground[p.id] || 0) * 0.75;
      v += campaignBonus(pts, tuning);

      v += (seat.candidate[p.id] || 0) * tuning.candidateWeight;

      v += issueAlignment(p, seat) * tuning.issueWeight;

      if (seat.incumbent === p.id) v += seat.incumbencyEffect;

      v += (game.leadership[p.id] || 0) * tuning.leadershipWeight;

      var mom = game.momentum[def.region];
      if (mom) v += (mom[p.id] || 0) * tuning.momentumWeight;

      raw[p.id] = v;
    });

    // Timed modifiers from events and alliances.
    seat.mods.forEach(function (m) {
      if (raw[m.partyId] !== undefined) raw[m.partyId] += m.delta;
    });

    return normalise(raw);
  }

  /* ------------------------------------------------------------------
   * 3. Ratings and reporting
   * ---------------------------------------------------------------- */

  function rank(shares) {
    return Object.keys(shares)
      .map(function (id) {
        return { id: id, share: shares[id] };
      })
      .sort(function (a, b) {
        return b.share - a.share;
      });
  }

  /** Rating for a seat from the point of view of `viewParty`. */
  function rate(shares, viewParty, tuning) {
    var r = rank(shares);
    var leader = r[0];
    var margin = r[0].share - r[1].share;
    var band = tuning.ratings[tuning.ratings.length - 1];
    for (var i = 0; i < tuning.ratings.length; i++) {
      if (margin >= tuning.ratings[i].min) {
        band = tuning.ratings[i];
        break;
      }
    }
    var playerShare = shares[viewParty] || 0;
    var playerRank = 1;
    r.forEach(function (e, idx) {
      if (e.id === viewParty) playerRank = idx + 1;
    });
    // The gap the player has to close (negative if they are ahead).
    var gap = leader.id === viewParty ? -(margin) : leader.share - playerShare;
    return {
      leader: leader.id,
      leaderShare: leader.share,
      runnerUp: r[1].id,
      margin: margin,
      band: band.id,
      bandLabel: band.label,
      playerLeads: leader.id === viewParty,
      playerShare: playerShare,
      playerRank: playerRank,
      gap: gap,
      ranked: r,
    };
  }

  /**
   * What the player is allowed to see. Adds stable per-turn polling noise that
   * shrinks as the campaign progresses, so early reads are unreliable but a
   * seat does not flicker within a single turn.
   */
  function pollShares(game, seatNum) {
    var stateDef = PG.getState(game.stateId);
    var phase = PG.engine.phaseFor(stateDef, game.turn);
    var truth = seatShares(game, seatNum);
    if (phase.pollNoise <= 0) return truth;
    var raw = {};
    Object.keys(truth).forEach(function (pid) {
      raw[pid] =
        truth[pid] + PG.rng.stableGauss(phase.pollNoise, game.seed, 'poll', game.turn, seatNum, pid);
    });
    return normalise(raw);
  }

  /* ------------------------------------------------------------------
   * 4. Election day
   * ---------------------------------------------------------------- */

  /**
   * Run the whole state. Correlated swings (statewide and per region) sit on
   * top of independent per-seat noise, so results move in waves rather than
   * 117 coin flips -- which is both more realistic and more dramatic.
   */
  function simulateElection(game) {
    var stateDef = PG.getState(game.stateId);
    var tuning = stateDef.tuning;
    var rng = PG.rng.create(game.seed + ':election');
    var regions = stateDef.regions();

    var stateSwing = {};
    PG.PARTIES.forEach(function (p) {
      stateSwing[p.id] = rng.gauss(tuning.stateSwing);
    });

    var regionSwing = {};
    Object.keys(regions).forEach(function (rName) {
      regionSwing[rName] = {};
      PG.PARTIES.forEach(function (p) {
        regionSwing[rName][p.id] = rng.gauss(tuning.regionSwing);
      });
    });

    var results = {};
    var votes = {};
    var seatCount = {};
    PG.PARTIES.forEach(function (p) {
      votes[p.id] = 0;
      seatCount[p.id] = 0;
    });

    var seatDefs = stateDef.seats();
    seatDefs.forEach(function (def) {
      var truth = seatShares(game, def.num);
      var raw = {};
      PG.PARTIES.forEach(function (p) {
        raw[p.id] =
          truth[p.id] +
          stateSwing[p.id] +
          regionSwing[def.region][p.id] +
          rng.gauss(tuning.seatNoise);
      });
      var final = normalise(raw);
      var r = rank(final);
      results[def.num] = {
        shares: final,
        winner: r[0].id,
        runnerUp: r[1].id,
        margin: r[0].share - r[1].share,
      };
      seatCount[r[0].id]++;
      PG.PARTIES.forEach(function (p) {
        votes[p.id] += final[p.id];
      });
    });

    var voteShare = {};
    PG.PARTIES.forEach(function (p) {
      voteShare[p.id] = votes[p.id] / seatDefs.length;
    });

    return {
      perSeat: results,
      seats: seatCount,
      voteShare: voteShare,
      stateSwing: stateSwing,
      regionSwing: regionSwing,
    };
  }

  /* ------------------------------------------------------------------
   * 5. Aggregates
   * ---------------------------------------------------------------- */

  /** Projected seat counts and ratings across the whole state. */
  function projectAll(game, options) {
    var opts = options || {};
    var stateDef = PG.getState(game.stateId);
    var tuning = stateDef.tuning;
    var useFog = opts.fog !== false;
    var seatDefs = stateDef.seats();

    var counts = {};
    var bands = { safe: 0, likely: 0, lean: 0, tossup: 0 };
    var playerBands = { safe: 0, likely: 0, lean: 0, tossup: 0 };
    var bySeat = {};
    var voteTotal = {};
    PG.PARTIES.forEach(function (p) {
      counts[p.id] = 0;
      voteTotal[p.id] = 0;
    });

    seatDefs.forEach(function (def) {
      var shares = useFog ? pollShares(game, def.num) : seatShares(game, def.num);
      var r = rate(shares, game.player.partyId, tuning);
      bySeat[def.num] = { shares: shares, rating: r };
      counts[r.leader]++;
      bands[r.band]++;
      if (r.playerLeads) playerBands[r.band]++;
      PG.PARTIES.forEach(function (p) {
        voteTotal[p.id] += shares[p.id];
      });
    });

    var voteShare = {};
    PG.PARTIES.forEach(function (p) {
      voteShare[p.id] = voteTotal[p.id] / seatDefs.length;
    });

    return {
      bySeat: bySeat,
      counts: counts,
      bands: bands,
      playerBands: playerBands,
      voteShare: voteShare,
      playerSeats: counts[game.player.partyId] || 0,
      total: seatDefs.length,
      majority: stateDef.majority(seatDefs.length),
    };
  }

  /** District-level roll-up, used by the district view. */
  function districtSummary(game, projection, districtName) {
    var stateDef = PG.getState(game.stateId);
    var district = stateDef.districts()[districtName];
    var playerId = game.player.partyId;
    var out = {
      name: districtName,
      region: district.region,
      seats: district.seats.length,
      player: 0,
      opponents: 0,
      competitive: 0,
      spend: 0,
      leaders: {},
      seatList: district.seats.slice(),
    };
    district.seats.forEach(function (num) {
      var p = projection.bySeat[num];
      if (p.rating.playerLeads) out.player++;
      else out.opponents++;
      if (p.rating.band === 'tossup' || p.rating.band === 'lean') out.competitive++;
      out.leaders[p.rating.leader] = (out.leaders[p.rating.leader] || 0) + 1;
      out.spend += game.seats[num].spend[playerId] || 0;
    });
    var mom = game.momentum[district.region] || {};
    out.momentum = mom[playerId] || 0;
    return out;
  }

  return {
    generateLandscape: generateLandscape,
    seatShares: seatShares,
    pollShares: pollShares,
    campaignBonus: campaignBonus,
    issueAlignment: issueAlignment,
    rate: rate,
    rank: rank,
    normalise: normalise,
    simulateElection: simulateElection,
    projectAll: projectAll,
    districtSummary: districtSummary,
    clamp: clamp,
  };
})();

/**
 * Campaign actions.
 * ------------------------------------------------------------------
 * The catalogue below is the game's balance sheet: every cost and every
 * effect a player or rival can buy lives here and nowhere else.
 *
 * Effects are deliberately NOT equally powerful per rupee:
 *   - canvassing is cheap, steady and safe
 *   - rallies buy a burst that decays, and spill into neighbouring seats
 *   - candidate work is slow and expensive but permanent and undecaying
 *   - promises are the highest ceiling and the lowest floor: they only pay
 *     if you have read what the constituency actually cares about
 *   - leadership tours are the best value in the game and strictly rationed
 *
 * Campaign points feed a diminishing-returns curve (see model.campaignBonus),
 * so pouring everything into one seat is always the wrong move.
 */
window.PG = window.PG || {};
PG.actions = (function () {
  'use strict';

  var URBANICITY = { urban: 1.0, 'semi-urban': 0.55, rural: 0.2 };

  function urbanicity(def) {
    return URBANICITY[def.settlement] || 0.5;
  }

  /* ------------------------------------------------------- helpers */

  function addPoints(game, seatNum, partyId, channel, amount) {
    var seat = game.seats[seatNum];
    var bucket = seat[channel];
    bucket[partyId] = (bucket[partyId] || 0) + amount;
  }

  function addSpend(game, seatNum, partyId, amount) {
    var seat = game.seats[seatNum];
    seat.spend[partyId] = (seat.spend[partyId] || 0) + amount;
  }

  function addMod(game, seatNum, partyId, delta, turns, source) {
    game.seats[seatNum].mods.push({
      partyId: partyId,
      delta: delta,
      turnsLeft: turns === undefined ? -1 : turns,
      source: source || '',
    });
  }

  /** Effect multiplier for a party acting on a seat, from traits + org level. */
  function multiplier(game, partyId, seatNum, actionId) {
    var stateDef = PG.getState(game.stateId);
    var def = PG.index.seatDef(game.stateId, seatNum);
    var party = PG.PARTY_BY_ID[partyId];
    var phase = PG.engine.phaseFor(stateDef, game.turn);
    var m = phase.effectMultiplier;

    var org = (game.org[partyId] || {})[def.district] || 0;
    m *= 1 + org;

    // Opening-strategy bonuses apply to the player only.
    if (partyId === game.player.partyId && actionId === 'advertising') {
      m *= (game.bonus && game.bonus.ad) || 1;
    }

    if (party.trait && party.trait.id === 'kisanBase') {
      if (def.settlement === 'rural' && (actionId === 'rally' || actionId === 'canvass')) {
        m *= 1.25;
      }
    }
    return m;
  }

  /** Distribute a pool of points across seats, weighted. */
  function spread(game, partyId, seatNums, pool, weightFn, channel, actionId, money) {
    var weights = seatNums.map(weightFn);
    var total = weights.reduce(function (a, b) {
      return a + b;
    }, 0) || 1;
    seatNums.forEach(function (num, i) {
      var share = weights[i] / total;
      addPoints(game, num, partyId, channel, pool * share * multiplier(game, partyId, num, actionId));
      if (money) addSpend(game, num, partyId, money * share);
    });
  }

  /* ------------------------------------------------------- catalogue */

  var CATALOGUE = [
    {
      id: 'canvass',
      label: 'Door-to-Door Canvass',
      icon: '\u{1F6AA}',
      scope: 'seat',
      cost: 2,
      tempo: 'Slow burn',
      blurb:
        'Workers walk the streets of one constituency. Cheap and dependable, and it never fades.',
      detail: 'Small, permanent gain in one seat. The best value per rupee if you have the weeks to spare.',
      run: function (game, partyId, target) {
        var m = multiplier(game, partyId, target.seat, 'canvass');
        addPoints(game, target.seat, partyId, 'camp', 1.9 * m);
        addPoints(game, target.seat, partyId, 'ground', 0.55 * m);
        addSpend(game, target.seat, partyId, this.cost);
        return { touched: [target.seat] };
      },
    },
    {
      id: 'rally',
      label: 'Public Rally',
      icon: '\u{1F4E3}',
      scope: 'seat',
      cost: 6,
      tempo: 'Burst',
      blurb: 'A crowd, a stage and a headline. Big immediate lift that fades week by week.',
      detail: 'Strong gain in the target seat and a smaller lift in every neighbouring constituency.',
      run: function (game, partyId, target) {
        var geo = PG.index.seatGeo(game.stateId, target.seat);
        addPoints(
          game,
          target.seat,
          partyId,
          'camp',
          5.4 * multiplier(game, partyId, target.seat, 'rally')
        );
        addSpend(game, target.seat, partyId, this.cost);
        var nbrs = geo.neighbours.slice(0, 5);
        nbrs.forEach(function (n) {
          addPoints(game, n, partyId, 'camp', 1.05 * multiplier(game, partyId, n, 'rally'));
        });
        // Every rally is also a bit of statewide visibility.
        game.leadership[partyId] = (game.leadership[partyId] || 0) + 0.13;
        return { touched: [target.seat].concat(nbrs) };
      },
    },
    {
      id: 'advertising',
      label: 'Media & Print Blitz',
      icon: '\u{1F4FA}',
      scope: 'district',
      cost: 9,
      tempo: 'Burst',
      blurb: 'Radio, cable, hoardings and full-page ads across a whole district.',
      detail: 'Covers every seat in the district. Lands hardest in urban constituencies.',

      run: function (game, partyId, target) {

      maxUsesFor: function (game, partyId) {

            .map(function (p) {
              return { id: p.id, v: seat.base[p.id] };
            })
            .sort(function (a, b) {
              return a.v - b.v;
            });
          var take = Math.min(3.4, rivals[0].v * 0.42);
          addMod(game, num, partyId, take, -1, 'alliance');
          addMod(game, num, rivals[0].id, -take, -1, 'alliance');
          addSpend(game, num, partyId, self.costFor(game, partyId) / seats.length);
        });
        // Backlash: rivals elsewhere use the deal against you.
        Object.keys(regions).forEach(function (rName) {
          if (rName === target.region) return;
          regions[rName].seats.forEach(function (num) {
            addMod(game, num, partyId, -0.75, -1, 'alliance-backlash');
          });
        });
        return { touched: seats.slice(), region: target.region };
      },
    },
  ];

  var BY_ID = CATALOGUE.reduce(function (m, a) {
    m[a.id] = a;
    return m;
  }, {});

  function costOf(game, partyId, actionId) {
    var a = BY_ID[actionId];
    return a.costFor ? a.costFor(game, partyId) : a.cost;
  }

  function maxUsesOf(game, partyId, actionId) {
    var a = BY_ID[actionId];
    if (!a.maxUses) return null;
    return a.maxUsesFor ? a.maxUsesFor(game, partyId) : a.maxUses;
  }

  function usesLeft(game, partyId, actionId) {
    var max = maxUsesOf(game, partyId, actionId);
    if (max === null) return null;
    var used = ((game.uses || {})[partyId] || {})[actionId] || 0;
    return Math.max(0, max - used);
  }

  return {
    catalogue: CATALOGUE,
    byId: BY_ID,
    costOf: costOf,
    maxUsesOf: maxUsesOf,
    usesLeft: usesLeft,
    urbanicity: urbanicity,
    multiplier: multiplier,
    addMod: addMod,
    addPoints: addPoints,
  };
})();

/**
 * Campaign events.
 * ------------------------------------------------------------------
 * Controlled drama. Events are drawn once or twice a turn from a weighted
 * deck, always land on a named seat / district / region rather than the whole
 * campaign, and are capped small enough that no single roll can end a run.
 *
 * Events prefer places the player is actually active, so the campaign reacts
 * to what you are doing instead of firing into the void.
 */
window.PG = window.PG || {};
PG.events = (function () {
  'use strict';

  /* ---------------------------------------------------------- pickers */

  function activeSeats(game, partyId) {
    var out = [];
    Object.keys(game.seats).forEach(function (num) {
      if ((game.seats[num].spend[partyId] || 0) > 0) out.push(+num);
    });
    return out;
  }

  function pickSeat(game, rng, partyId, projection) {
    var active = activeSeats(game, partyId);
    var pool = active.length && rng.chance(0.7) ? active : Object.keys(game.seats).map(Number);
    // Prefer somewhere competitive so the event actually matters.
    var competitive = pool.filter(function (n) {
      var b = projection.bySeat[n].rating.band;
      return b === 'tossup' || b === 'lean';
    });
    return rng.pick(competitive.length && rng.chance(0.75) ? competitive : pool);
  }

  function pickDistrict(game, rng, partyId) {
    var st = PG.getState(game.stateId);
    var names = Object.keys(st.districts());
    var spent = {};
    activeSeats(game, partyId).forEach(function (n) {
      var d = PG.index.seatDef(game.stateId, n).district;
      spent[d] = (spent[d] || 0) + (game.seats[n].spend[partyId] || 0);
    });
    var busy = Object.keys(spent);
    return rng.pick(busy.length && rng.chance(0.65) ? busy : names);
  }

  function pickRegion(game, rng) {
    return rng.pick(Object.keys(PG.getState(game.stateId).regions()));
  }

  function strongestRival(game) {
    var best = null;
    PG.PARTIES.forEach(function (p) {
      if (p.id === game.player.partyId || !p.playable) return;
      var v = game.standing[p.id] || 0;
      if (!best || v > best.v) best = { id: p.id, v: v };
    });
    return best ? best.id : PG.PARTIES[0].id;
  }

  function seatName(game, num) {
    var d = PG.index.seatDef(game.stateId, num);
    return d.name + ' (' + d.district + ')';
  }

  /* ---------------------------------------------------------- deck */

  var DECK = [
    /* ------------------------------ positive */
    {
      id: 'bigCrowd',
      kind: 'positive',
      weight: 10,
      title: 'Rally draws a huge crowd',
      run: function (game, rng, proj) {
        var pid = game.player.partyId;
        var num = pickSeat(game, rng, pid, proj);
        PG.actions.addPoints(game, num, pid, 'camp', 2.4);
        return {
          seat: num,
          text:
            'Your meeting at ' +
            seatName(game, num) +
            ' overflowed onto the road. Local news carried it all evening.',
        };
      },
    },
    {
      id: 'localHero',
      kind: 'positive',
      weight: 9,
      title: 'A local favourite steps forward',
      run: function (game, rng, proj) {
        var pid = game.player.partyId;
        var num = pickSeat(game, rng, pid, proj);
        game.seats[num].candidate[pid] = (game.seats[num].candidate[pid] || 0) + 2.2;
        return {
          seat: num,
          text:
            'A well-liked panchayat leader in ' +
            seatName(game, num) +
            ' has agreed to carry your banner. Your candidate there is suddenly credible.',
        };
      },
    },
    {
      id: 'defection',
      kind: 'positive',
      weight: 6,
      title: 'A rival organiser crosses over',
      run: function (game, rng, proj) {
        var pid = game.player.partyId;
        var num = pickSeat(game, rng, pid, proj);
        var rival = strongestRival(game);
        PG.actions.addPoints(game, num, pid, 'camp', 2.0);
        PG.actions.addMod(game, num, rival, -1.6, -1, 'defection');
        return {
          seat: num,
          text:
            PG.PARTY_BY_ID[rival].short +
            "'s booth organiser in " +
            seatName(game, num) +
            ' has joined you, and brought his workers with him.',
        };
      },
    },
    {
      id: 'volunteerSurge',
      kind: 'positive',
      weight: 8,
      title: 'Volunteers turn out in force',
      run: function (game, rng) {
        var pid = game.player.partyId;
        var district = pickDistrict(game, rng, pid);
        var seats = PG.getState(game.stateId).districts()[district].seats;
        seats.forEach(function (n) {
          PG.actions.addPoints(game, n, pid, 'ground', 0.75);
        });
        return {
          district: district,
          text:
            'Booth committees across ' +
            district +
            ' filled up over the weekend. Your organisation there is noticeably stronger.',
        };
      },
    },
    {
      id: 'endorsement',
      kind: 'positive',
      weight: 6,
      title: 'A big endorsement lands',
      run: function (game, rng) {
        var pid = game.player.partyId;
        var region = pickRegion(game, rng);
        var seats = PG.getState(game.stateId).regions()[region].seats;
        seats.forEach(function (n) {
          PG.actions.addMod(game, n, pid, 0.9, 3, 'endorsement');
        });
        return {
          region: region,
          text:
            'A respected growers’ association across ' +
            region +
            ' has come out for you. Expect three good weeks in the region.',
        };
      },
    },
    {
      id: 'policyWin',
      kind: 'positive',
      weight: 5,
      title: 'Your policy launch cuts through',
      run: function (game) {
        var pid = game.player.partyId;
        game.leadership[pid] = (game.leadership[pid] || 0) + 0.55;
        return {
          text: 'Your manifesto launch led the evening bulletins statewide. Your personal standing is up.',
        };
      },
    },

    /* ------------------------------ negative */
    {
      id: 'controversy',
      kind: 'negative',
      weight: 9,
      title: 'Campaign controversy',
      run: function (game, rng) {
        var pid = game.player.partyId;
        var district = pickDistrict(game, rng, pid);
        var seats = PG.getState(game.stateId).districts()[district].seats;
        seats.forEach(function (n) {
          PG.actions.addMod(game, n, pid, -1.7, 3, 'controversy');
        });
        return {
          district: district,
          text:
            'A remark by one of your speakers in ' +
            district +
            ' is being replayed on every channel. It will cost you locally for a few weeks.',
        };
      },
    },
    {
      id: 'rivalSurge',
      kind: 'negative',
      weight: 9,
      title: 'A rival surges',
      run: function (game, rng) {
        var region = pickRegion(game, rng);
        var rival = strongestRival(game);
        if (!game.momentum[region]) game.momentum[region] = {};
        game.momentum[region][rival] = (game.momentum[region][rival] || 0) + 1.3;
        return {
          region: region,
          rival: rival,
          text:
            PG.PARTY_BY_ID[rival].name +
            ' has caught a wave across ' +
            region +
            '. Their numbers there are climbing.',
        };
      },
    },
    {
      id: 'promiseBacklash',
      kind: 'negative',
      weight: 7,
      title: 'Local backlash',
      run: function (game, rng, proj) {
        var pid = game.player.partyId;
        var num = pickSeat(game, rng, pid, proj);
        var issue = PG.ISSUE_BY_ID[game.seats[num].localIssue];
        PG.actions.addMod(game, num, pid, -2.0, 4, 'backlash');
        return {
          seat: num,
          text:
            'An agitation over ' +
            issue.label.toLowerCase() +
            ' has broken out in ' +
            seatName(game, num) +
            ', and your campaign is being blamed for ignoring it.',
        };
      },
    },
    {
      id: 'candidateResigns',
      kind: 'negative',
      weight: 5,
      title: 'A candidate withdraws',
      run: function (game, rng, proj) {
        var pid = game.player.partyId;
        var num = pickSeat(game, rng, pid, proj);
        var seat = game.seats[num];
        seat.candidate[pid] = Math.min(seat.candidate[pid] || 0, 0) - 1.4;
        return {
          seat: num,
          text:
            'Your candidate in ' +
            seatName(game, num) +
            ' has pulled out over a ticket dispute. The replacement is an unknown.',
        };
      },
    },
    {
      id: 'infighting',
      kind: 'negative',
      weight: 5,
      title: 'Infighting spills into public',
      run: function (game) {
        var pid = game.player.partyId;
        game.leadership[pid] = (game.leadership[pid] || 0) - 0.5;
        return {
          text:
            'Two of your state office-bearers traded accusations in front of reporters. Not a good look.',
        };
      },
    },
    {
      id: 'opponentBlitz',
      kind: 'negative',
      weight: 7,
      title: 'Rival pours money into a district',
      run: function (game, rng, proj) {
        var rival = strongestRival(game);
        var district = pickDistrict(game, rng, game.player.partyId);
        var seats = PG.getState(game.stateId).districts()[district].seats;
        seats.forEach(function (n) {
          PG.actions.addPoints(game, n, rival, 'camp', 1.5);
        });
        return {
          district: district,
          rival: rival,
          text:
            PG.PARTY_BY_ID[rival].short +
            ' has flooded ' +
            district +
            ' with hoardings and cable spots this week.',
        };
      },
    },
  ];

  var TOTAL_WEIGHT = DECK.reduce(function (t, e) {
    return t + e.weight;
  }, 0);

  /**
   * Draw and apply this turn's events. Early turns skew positive so the
   * opening of a campaign feels like it is going somewhere.
   */
  function runTurn(game, projection) {
    var stateDef = PG.getState(game.stateId);
    var rng = PG.rng.create(game.seed + ':events:' + game.turn);
    var count = rng.chance(0.45) ? 2 : 1;
    var progress = game.turn / stateDef.campaign.turns;
    var negativeBias = 0.35 + progress * 0.3; // 0.35 -> 0.65
    var fired = [];
    var used = {};

    for (var i = 0; i < count; i++) {
      var wantNegative = rng.chance(negativeBias);
      var pool = DECK.filter(function (e) {
        if (used[e.id]) return false;
        return wantNegative ? e.kind === 'negative' : e.kind === 'positive';
      });
      if (!pool.length) pool = DECK.filter(function (e) { return !used[e.id]; });
      if (!pool.length) break;

      var totalW = pool.reduce(function (t, e) {
        return t + e.weight;
      }, 0);
      var roll = rng.range(0, totalW);
      var chosen = pool[0];
      for (var j = 0; j < pool.length; j++) {
        roll -= pool[j].weight;
        if (roll <= 0) {
          chosen = pool[j];
          break;
        }
      }
      used[chosen.id] = true;
      var res = chosen.run(game, rng, projection) || {};
      fired.push({
        id: chosen.id,
        kind: chosen.kind,
        title: chosen.title,
        text: res.text || '',
        seat: res.seat,
        district: res.district,
        region: res.region,
        turn: game.turn,
      });
    }
    return fired;
  }

  return { runTurn: runTurn, deck: DECK, totalWeight: TOTAL_WEIGHT };
})();


/* ===== src/engine/ai.js ===== */
/**
 * Rival campaigns.
 * ------------------------------------------------------------------
 * Every rival faces the same problem the player does -- a fixed purse and
 * 117 seats -- and solves it with the same action catalogue. Skill controls
 * how sharply they aim: a low-skill rival scatters money over seats it is
 * already winning, a high-skill rival hunts marginals.
 *
 * Rivals also react to the player: seats where the player has just surged
 * get extra attention, which is what makes late-campaign leads hard to hold.
 */
window.PG = window.PG || {};
PG.ai = (function () {
  'use strict';

  var BUYABLE = ['canvass', 'rally', 'advertising', 'candidateWork', 'volunteers'];

  function rivalIds(game) {
    return PG.PARTIES.filter(function (p) {
      return p.playable && p.id !== game.player.partyId;
    }).map(function (p) {
      return p.id;
    });
  }

  /** Score every seat for one rival: how much is a rupee here worth? */
  function targets(game, partyId, skill) {
    var st = PG.getState(game.stateId);
    var out = [];
    st.seats().forEach(function (def) {
      var shares = PG.model.seatShares(game, def.num);
      var ranked = PG.model.rank(shares);
      var mine = shares[partyId];
      var leader = ranked[0];
      var gap = leader.id === partyId ? mine - ranked[1].share : leader.share - mine;

      // Winnable and close is worth most; hopeless and safe are worth least.
      var value = 1 / (1 + Math.abs(gap) * 0.55);
      if (leader.id !== partyId && gap > 18) value *= 0.15; // out of reach
      if (leader.id === partyId && gap > 18) value *= 0.2; // already banked

      // Punish the player where they have been spending.
      var playerPush = game.seats[def.num].spend[game.player.partyId] || 0;
      value *= 1 + Math.min(0.7, playerPush * 0.016) * skill;

      out.push({ num: def.num, district: def.district, value: value });
    });
    out.sort(function (a, b) {
      return b.value - a.value;
    });
    return out;
  }

  /**
   * Spend one rival's weekly purse. Returns a spend-by-district summary the
   * briefing system uses to tell the player what their opponents did.
   */
  function runParty(game, partyId, rng) {
    var st = PG.getState(game.stateId);
    var diff = st.difficulties[game.difficulty];
    var skill = diff.rivalSkill;
    var purse = game.rivals[partyId].perTurn;
    var spentByDistrict = {};

    var ranked = targets(game, partyId, skill);
    // Low skill picks from a much wider, sloppier pool.
    var poolSize = Math.max(6, Math.round(ranked.length * (1.05 - skill * 0.9)));
    var pool = ranked.slice(0, poolSize);

    var guard = 0;
    while (purse >= 2 && guard++ < 40) {
      var pick = pool[Math.floor(Math.pow(rng.next(), 1 + skill * 2) * pool.length)];
      if (!pick) break;

      var affordable = BUYABLE.filter(function (id) {
        return PG.actions.costOf(game, partyId, id) <= purse;
      });
      if (!affordable.length) break;

      // Better rivals lean on the higher-leverage tools.
      var weights = {
        canvass: 3,
        rally: 2 + skill * 3,
        advertising: 1 + skill * 2,
        candidateWork: 1 + skill * 2.5,
        volunteers: 1 + skill,
      };
      var totalW = affordable.reduce(function (t, id) {
        return t + weights[id];
      }, 0);
      var roll = rng.range(0, totalW);
      var actionId = affordable[0];
      for (var i = 0; i < affordable.length; i++) {
        roll -= weights[affordable[i]];
        if (roll <= 0) {
          actionId = affordable[i];
          break;
        }
      }

      var action = PG.actions.byId[actionId];
      var cost = PG.actions.costOf(game, partyId, actionId);
      var target =
        action.scope === 'district' ? { district: pick.district } : { seat: pick.num };
      action.run(game, partyId, target);

      purse -= cost;
      game.rivals[partyId].spent += cost;
      spentByDistrict[pick.district] = (spentByDistrict[pick.district] || 0) + cost;
    }

    return spentByDistrict;
  }

  /** Run every rival for the current turn. */
  function runTurn(game) {
    var rng = PG.rng.create(game.seed + ':ai:' + game.turn);
    var summary = {};
    rivalIds(game).forEach(function (pid) {
      summary[pid] = runParty(game, pid, rng);
    });
    return summary;
  }

  return { runTurn: runTurn, rivalIds: rivalIds, targets: targets };
})();


/* ===== src/engine/engine.js ===== */
/**
 * Game engine.
 * ------------------------------------------------------------------
 * Owns the game state and the turn loop. Nothing in here touches the DOM or
 * localStorage; the UI reads state and calls these functions, never the
 * other way round.
 *
 * Turn loop, once per week:
 *   player spends actions -> endTurn -> decay -> rivals campaign -> events
 *   -> briefings written -> next week
 * After the final week the state moves to 'electionDay' and runElection()
 * simulates all seats at once.
 */
window.PG = window.PG || {};
PG.engine = (function () {
  'use strict';

  var SAVE_VERSION = 1;

  /* ------------------------------------------------------------ phases */

  function phaseFor(stateDef, turn) {
    var phases = stateDef.campaign.phases;
    var found = phases[0];
    for (var i = 0; i < phases.length; i++) {
      if (turn >= phases[i].from) found = phases[i];
    }
    return found;
  }

  /* ------------------------------------------------------------ new game */

  function newGame(opts) {
    var stateId = opts.stateId || PG.DEFAULT_STATE;
    var stateDef = PG.getState(stateId);
    var difficulty = opts.difficulty || 'normal';
    var diff = stateDef.difficulties[difficulty];
    var seed = opts.seed || PG.rng.randomSeed();
    var partyId = opts.partyId;
    var party = PG.PARTY_BY_ID[partyId];
    if (!party || !party.playable) throw new Error('Pick a playable party');

    var landscape = PG.model.generateLandscape(stateDef, seed, difficulty, partyId);

    var game = {
      version: SAVE_VERSION,
      id: seed + '-' + partyId,
      stateId: stateId,
      seed: seed,
      difficulty: difficulty,
      createdAt: opts.now || 0,
      updatedAt: opts.now || 0,
      player: {
        name: (opts.candidateName || '').trim() || 'Independent Candidate',
        partyId: partyId,
        slogan: (opts.slogan || '').trim() || party.slogan,
        strategyId: opts.strategyId || 'grassroots',
      },
      status: 'campaign', // campaign | electionDay | results
      turn: 1,
      budget: { total: diff.budget, spent: 0 },
      actionsLeft: stateDef.campaign.actionsPerTurn,
      seats: landscape.seats,
      leadership: {},
      momentum: {},
      org: {},
      bonus: { ad: 1, tours: 0 },
      uses: {},
      rivals: {},
      standing: {},
      feed: [],
      history: [],
      baseline: null,
      result: null,
    };

    PG.PARTIES.forEach(function (p) {
      game.leadership[p.id] = 0;
    });
    Object.keys(stateDef.regions()).forEach(function (r) {
      game.momentum[r] = {};
      PG.PARTIES.forEach(function (p) {
        game.momentum[r][p.id] = 0;
      });
    });

    // Rival purses, sized off the player's and spread over the campaign.
    PG.ai.rivalIds(game).forEach(function (pid) {
      var total = Math.round(diff.budget * diff.rivalBudget);
      game.rivals[pid] = {
        budget: total,
        perTurn: total / stateDef.campaign.turns,
        spent: 0,
      };
    });

    // Opening strategy.
    var strategy = PG.STRATEGY_BY_ID[game.player.strategyId];
    if (strategy) {
      var ctx = { strongestDistricts: strongestDistricts(game, partyId) };
      strategy.apply(game, ctx);
    }

    var opening = PG.model.projectAll(game, { fog: false });
    game.baseline = { counts: opening.counts, voteShare: opening.voteShare };
    game.standing = opening.voteShare;

    pushFeed(game, {
      kind: 'phase',
      tone: 'neutral',
      title: 'Campaign begins',
      text:
        'Nominations are in across all ' +
        stateDef.totalSeats +
        ' constituencies. ' +
        stateDef.campaign.turns +
        ' weeks to polling day, and ' +
        stateDef.majority(stateDef.totalSeats) +
        ' seats to win.',
    });

    return game;
  }

  function strongestDistricts(game, partyId) {
    var stateDef = PG.getState(game.stateId);
    var districts = stateDef.districts();
    return Object.keys(districts)
      .map(function (name) {
        var t = 0;
        districts[name].seats.forEach(function (n) {
          t += game.seats[n].base[partyId];
        });
        return { name: name, avg: t / districts[name].seats.length };
      })
      .sort(function (a, b) {
        return b.avg - a.avg;
      })
      .map(function (d) {
        return d.name;
      });
  }

  /* ------------------------------------------------------------ feed */

  function pushFeed(game, entry) {
    entry.turn = game.turn;
    game.feed.unshift(entry);
    if (game.feed.length > 160) game.feed.length = 160;
  }

  /* ------------------------------------------------------------ actions */

  function moneyLeft(game) {
    return game.budget.total - game.budget.spent;
  }

  function canPlay(game, actionId, target) {
    var action = PG.actions.byId[actionId];
    if (!action) return { ok: false, reason: 'Unknown action' };
    if (game.status !== 'campaign') return { ok: false, reason: 'Campaigning has closed' };
    if (game.actionsLeft <= 0) return { ok: false, reason: 'No campaign actions left this week' };

    var cost = PG.actions.costOf(game, game.player.partyId, actionId);
    if (cost > moneyLeft(game)) return { ok: false, reason: 'Not enough money left' };

    var left = PG.actions.usesLeft(game, game.player.partyId, actionId);
    if (left !== null && left <= 0) return { ok: false, reason: 'No uses of this remain' };

    if (action.scope === 'seat' && !(target && target.seat)) {
      return { ok: false, reason: 'Pick a constituency first' };
    }
    if (action.scope === 'district' && !(target && target.district)) {
      return { ok: false, reason: 'Pick a district first' };
    }
    if (action.scope === 'region' && !(target && target.region)) {
      return { ok: false, reason: 'Pick a region first' };
    }
    return { ok: true, cost: cost };
  }

  function play(game, actionId, target) {
    var check = canPlay(game, actionId, target);
    if (!check.ok) return check;

    var pid = game.player.partyId;
    var action = PG.actions.byId[actionId];
    var before = PG.model.seatShares(game, target.seat || firstSeatOf(game, target));

    var res = action.run(game, pid, target) || {};

    game.budget.spent += check.cost;
    game.actionsLeft -= 1;
    if (!game.uses[pid]) game.uses[pid] = {};
    game.uses[pid][actionId] = (game.uses[pid][actionId] || 0) + 1;

    var where = describeTarget(game, action, target);
    var after = PG.model.seatShares(game, target.seat || firstSeatOf(game, target));
    var delta = after[pid] - before[pid];

    pushFeed(game, {
      kind: 'action',
      tone: 'good',
      title: action.label,
      text: where + '.',
      seat: target.seat,
      district: target.district,
      region: target.region,
      cost: check.cost,
    });

    return { ok: true, cost: check.cost, delta: delta, result: res, action: action };
  }

  function firstSeatOf(game, target) {
    var stateDef = PG.getState(game.stateId);
    if (target.district) return stateDef.districts()[target.district].seats[0];
    if (target.region) return stateDef.regions()[target.region].seats[0];
    return stateDef.seats()[0].num;
  }

  function describeTarget(game, action, target) {
    if (target.seat) {
      var d = PG.index.seatDef(game.stateId, target.seat);
      return d.name + ', ' + d.district;
    }
    if (target.district) return 'across ' + target.district + ' district';
    if (target.region) return 'across the ' + target.region + ' region';
    return 'statewide';
  }

  /* ------------------------------------------------------------ end turn */

  function decay(game) {
    var stateDef = PG.getState(game.stateId);
    var rate = 1 - stateDef.tuning.campaignDecay;
    Object.keys(game.seats).forEach(function (num) {
      var seat = game.seats[num];
      Object.keys(seat.camp).forEach(function (pid) {
        seat.camp[pid] *= rate;
      });
      seat.mods = seat.mods.filter(function (m) {
        if (m.turnsLeft < 0) return true;
        m.turnsLeft -= 1;
        return m.turnsLeft > 0;
      });
    });
    PG.PARTIES.forEach(function (p) {
      game.leadership[p.id] *= 0.9;
    });
    Object.keys(game.momentum).forEach(function (r) {
      PG.PARTIES.forEach(function (p) {
        game.momentum[r][p.id] *= 0.8;
      });
    });
  }

  function endTurn(game) {
    if (game.status !== 'campaign') return { ok: false, reason: 'Campaigning has closed' };
    var stateDef = PG.getState(game.stateId);
    var before = PG.model.projectAll(game, { fog: false });

    decay(game);
    var rivalSpend = PG.ai.runTurn(game);
    var fired = PG.events.runTurn(game, before);

    fired.forEach(function (e) {
      pushFeed(game, {
        kind: 'event',
        tone: e.kind === 'positive' ? 'good' : e.kind === 'negative' ? 'bad' : 'neutral',
        title: e.title,
        text: e.text,
        seat: e.seat,
        district: e.district,
        region: e.region,
      });
    });

    var after = PG.model.projectAll(game, { fog: false });
    awardMomentum(game, before, after);
    game.standing = after.voteShare;
    game.history.push({
      turn: game.turn,
      playerSeats: after.playerSeats,
      voteShare: after.voteShare[game.player.partyId],
      spent: game.budget.spent,
    });

    briefings(game, before, after, rivalSpend).forEach(function (b) {
      pushFeed(game, b);
    });

    var wasPhase = phaseFor(stateDef, game.turn);
    game.turn += 1;
    game.actionsLeft = stateDef.campaign.actionsPerTurn;
    game.updatedAt = Date.now();

    if (game.turn > stateDef.campaign.turns) {
      game.status = 'electionDay';
      game.turn = stateDef.campaign.turns;
      pushFeed(game, {
        kind: 'phase',
        tone: 'neutral',
        title: 'Campaigning has closed',
        text: 'The silence period has begun. Nothing more can be done — Punjab votes tomorrow.',
      });
    } else {
      var nowPhase = phaseFor(stateDef, game.turn);
      if (nowPhase.id !== wasPhase.id) {
        pushFeed(game, {
          kind: 'phase',
          tone: 'neutral',
          title: nowPhase.label,
          text: nowPhase.blurb,
        });
      }
    }

    return { ok: true, events: fired };
  }

  /**
   * Regional momentum is earned, not given. A party that picks up seats in a
   * region this week gets a wave there that lifts every seat in it next week
   * -- and a party going backwards gets the reverse. This is what lets a
   * well-run campaign compound instead of grinding one seat at a time.
   */
  function awardMomentum(game, before, after) {
    var stateDef = PG.getState(game.stateId);
    var regions = stateDef.regions();
    Object.keys(regions).forEach(function (rName) {
      var counts = {};
      PG.PARTIES.forEach(function (p) {
        counts[p.id] = { before: 0, after: 0 };
      });
      regions[rName].seats.forEach(function (n) {
        counts[before.bySeat[n].rating.leader].before++;
        counts[after.bySeat[n].rating.leader].after++;
      });
      if (!game.momentum[rName]) game.momentum[rName] = {};
      PG.PARTIES.forEach(function (p) {
        var delta = counts[p.id].after - counts[p.id].before;
        if (!delta) return;
        var gain = delta * 0.3;
        var cur = game.momentum[rName][p.id] || 0;
        game.momentum[rName][p.id] = Math.max(-2.2, Math.min(2.2, cur + gain));
      });
    });
  }

  /* ------------------------------------------------------------ briefings */

  function briefings(game, before, after, rivalSpend) {
    var out = [];
    var pid = game.player.partyId;
    var stateDef = PG.getState(game.stateId);

    // Seat movement.
    var seatDelta = after.playerSeats - before.playerSeats;
    if (seatDelta !== 0) {
      out.push({
        kind: 'brief',
        tone: seatDelta > 0 ? 'good' : 'bad',
        title: 'Projection moves',
        text:
          'Your projected total ' +
          (seatDelta > 0 ? 'rises' : 'falls') +
          ' by ' +
          Math.abs(seatDelta) +
          ' to ' +
          after.playerSeats +
          ' of ' +
          after.total +
          '.',
      });
    }

    // Statewide tightening or stretching.
    function topTwoGap(p) {
      var r = PG.model.rank(p.voteShare);
      return r[0].share - r[1].share;
    }
    var gapBefore = topTwoGap(before);
    var gapAfter = topTwoGap(after);
    if (Math.abs(gapAfter - gapBefore) > 0.35) {
      out.push({
        kind: 'brief',
        tone: 'neutral',
        title: 'Statewide polling',
        text:
          gapAfter < gapBefore
            ? stateDef.name + '-wide polling has tightened at the top of the field.'
            : 'The gap at the top of the ' + stateDef.name + ' field has widened.',
      });
    }

    // Toss-ups appearing.
    var newTossups = after.bands.tossup - before.bands.tossup;
    if (newTossups >= 2) {
      out.push({
        kind: 'brief',
        tone: 'neutral',
        title: 'The map loosens',
        text: newTossups + ' more constituencies have become toss-ups.',
      });
    } else if (newTossups <= -2) {
      out.push({
        kind: 'brief',
        tone: 'neutral',
        title: 'The map hardens',
        text: Math.abs(newTossups) + ' toss-ups have settled into a clear lean.',
      });
    }

    // Regional momentum.
    var regions = stateDef.regions();
    Object.keys(regions).forEach(function (rName) {
      var b = 0;
      var a = 0;
      regions[rName].seats.forEach(function (n) {
        if (before.bySeat[n].rating.playerLeads) b++;
        if (after.bySeat[n].rating.playerLeads) a++;
      });
      if (a - b >= 2) {
        out.push({
          kind: 'brief',
          tone: 'good',
          title: 'Momentum in ' + rName,
          text: 'Your campaign is gaining ground in ' + rName + ' — up ' + (a - b) + ' seats there.',
          region: rName,
        });
      } else if (b - a >= 2) {
        out.push({
          kind: 'brief',
          tone: 'bad',
          title: 'Slipping in ' + rName,
          text: 'You have lost the lead in ' + (b - a) + ' ' + rName + ' seats this week.',
          region: rName,
        });
      }
    });

    // What the rivals did with their money.
    Object.keys(rivalSpend || {}).forEach(function (rid) {
      var byDistrict = rivalSpend[rid];
      var top = null;
      Object.keys(byDistrict).forEach(function (d) {
        if (!top || byDistrict[d] > byDistrict[top]) top = d;
      });
      if (top && byDistrict[top] >= 8) {
        out.push({
          kind: 'brief',
          tone: 'bad',
          title: PG.PARTY_BY_ID[rid].short + ' targets ' + top,
          text:
            PG.PARTY_BY_ID[rid].name +
            ' has stepped up spending across ' +
            top +
            ' district this week.',
          district: top,
        });
      }
    });

    return out.slice(0, 6);
  }

  /* ------------------------------------------------------------ election */

  function runElection(game) {
    if (game.status === 'results') return game.result;
    var stateDef = PG.getState(game.stateId);
    var sim = PG.model.simulateElection(game);
    var pid = game.player.partyId;
    var total = stateDef.totalSeats;
    var majority = stateDef.majority(total);
    var playerSeats = sim.seats[pid] || 0;

    var standings = PG.PARTIES.map(function (p) {
      return {
        id: p.id,
        seats: sim.seats[p.id] || 0,
        voteShare: sim.voteShare[p.id] || 0,
        change: (sim.seats[p.id] || 0) - (game.baseline.counts[p.id] || 0),
      };
    }).sort(function (a, b) {
      return b.seats - a.seats || b.voteShare - a.voteShare;
    });

    var largest = standings[0];
    var outcome;
    var coalition = null;

    if (playerSeats >= majority) {
      outcome = 'majority';
    } else if (largest.id === pid) {
      // Hung house, player largest: try to put a coalition together.
      var partners = standings
        .filter(function (s) {
          return s.id !== pid && s.seats > 0;
        })
        .sort(function (a, b) {
          return a.seats - b.seats;
        });
      var needed = majority - playerSeats;
      var partner = null;
      for (var i = 0; i < partners.length; i++) {
        if (partners[i].seats >= needed) {
          partner = partners[i];
          break;
        }
      }
      var usedAlliance = ((game.uses[pid] || {}).alliance || 0) > 0;
      var withinReach = playerSeats >= majority - 12;
      var goodwill = withinReach && (usedAlliance || playerSeats >= majority - 6);
      if (partner && goodwill) {
        outcome = 'coalition';
        coalition = { partnerId: partner.id, total: playerSeats + partner.seats };
      } else {
        outcome = 'hung';
      }
    } else {
      outcome = 'defeat';
