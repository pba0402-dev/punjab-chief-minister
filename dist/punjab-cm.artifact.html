    }

    var result = {
      perSeat: sim.perSeat,
      standings: standings,
      playerSeats: playerSeats,
      majority: majority,
      total: total,
      outcome: outcome,
      coalition: coalition,
      governmentFormed: outcome === 'majority' || outcome === 'coalition',
      spent: game.budget.spent,
      budget: game.budget.total,
      turnout: 0,
    };

    game.result = result;
    game.status = 'results';
    pushFeed(game, {
      kind: 'phase',
      tone: result.governmentFormed ? 'good' : 'bad',
      title: 'Result declared',
      text:
        PG.PARTY_BY_ID[pid].short +
        ' wins ' +
        playerSeats +
        ' of ' +
        total +
        ' seats. ' +
        (result.governmentFormed
          ? 'Government formed.'
          : 'Short of the ' + majority + ' needed.'),
    });
    return result;
  }

  /* ------------------------------------------------------------ misc */

  function seatsNeeded(game) {
    var stateDef = PG.getState(game.stateId);
    return stateDef.majority(stateDef.totalSeats);
  }

  function turnsLeft(game) {
    var stateDef = PG.getState(game.stateId);
    if (game.status !== 'campaign') return 0;
    return stateDef.campaign.turns - game.turn + 1;
  }

  return {
    SAVE_VERSION: SAVE_VERSION,
    newGame: newGame,
    phaseFor: phaseFor,
    canPlay: canPlay,
    play: play,
    endTurn: endTurn,
    runElection: runElection,
    moneyLeft: moneyLeft,
    seatsNeeded: seatsNeeded,
    turnsLeft: turnsLeft,
    pushFeed: pushFeed,
    strongestDistricts: strongestDistricts,
  };
})();


/* ===== src/persistence/storage.js ===== */
/**
 * Persistence.
 * ------------------------------------------------------------------
 * Save/load sits behind a small adapter interface, so swapping localStorage
 * for a server or IndexedDB later means writing one new adapter and changing
 * PG.storage.use(...). Nothing else in the game knows where saves live.
 *
 * Adapter contract:
 *   read(key) -> string|null   write(key, value)   remove(key)   keys() -> [string]
 */
window.PG = window.PG || {};
PG.storage = (function () {
  'use strict';

  var PREFIX = 'pg.punjab.';
  var INDEX_KEY = PREFIX + 'index';
  var AUTOSAVE = 'autosave';

  /* ------------------------------------------------------------ adapters */

  function localStorageAdapter() {
    var ok = (function () {
      try {
        var t = PREFIX + 'test';
        window.localStorage.setItem(t, '1');
        window.localStorage.removeItem(t);
        return true;
      } catch (e) {
        return false;
      }
    })();
    if (!ok) return null;
    return {
      id: 'localStorage',
      read: function (k) {
        return window.localStorage.getItem(k);
      },
      write: function (k, v) {
        window.localStorage.setItem(k, v);
      },
      remove: function (k) {
        window.localStorage.removeItem(k);
      },
    };
  }

  /** Used when the browser blocks storage (private mode, file:// quirks). */
  function memoryAdapter() {
    var mem = {};
    return {
      id: 'memory',
      read: function (k) {
        return Object.prototype.hasOwnProperty.call(mem, k) ? mem[k] : null;
      },
      write: function (k, v) {
        mem[k] = v;
      },
      remove: function (k) {
        delete mem[k];
      },
    };
  }

  var adapter = localStorageAdapter() || memoryAdapter();

  /* ------------------------------------------------------------ index */

  function readIndex() {
    try {
      return JSON.parse(adapter.read(INDEX_KEY) || '[]');
    } catch (e) {
      return [];
    }
  }

  function writeIndex(list) {
    try {
      adapter.write(INDEX_KEY, JSON.stringify(list));
    } catch (e) {
      /* quota - the save itself already failed loudly */
    }
  }

  function describe(game) {
    var party = PG.PARTY_BY_ID[game.player.partyId];
    var st = PG.getState(game.stateId);
    return {
      slot: null,
      stateId: game.stateId,
      stateName: st.name,
      candidate: game.player.name,
      party: party.short,
      partyName: party.name,
      colour: party.colour,
      turn: game.turn,
      turns: st.campaign.turns,
      status: game.status,
      difficulty: game.difficulty,
      seats: game.history.length
        ? game.history[game.history.length - 1].playerSeats
        : null,
      savedAt: Date.now(),
    };
  }

  /* ------------------------------------------------------------ api */

  function save(game, slot) {
    var key = slot || AUTOSAVE;
    var meta = describe(game);
    meta.slot = key;
    try {
      adapter.write(PREFIX + 'save.' + key, JSON.stringify(game));
    } catch (e) {
      return { ok: false, reason: 'Storage is full or unavailable.' };
    }
    var list = readIndex().filter(function (m) {
      return m.slot !== key;
    });
    list.unshift(meta);
    writeIndex(list.slice(0, 12));
    return { ok: true, meta: meta };
  }

  function load(slot) {
    var raw = adapter.read(PREFIX + 'save.' + (slot || AUTOSAVE));
    if (!raw) return null;
    try {
      var game = JSON.parse(raw);
      if (!game || game.version !== PG.engine.SAVE_VERSION) return null;
      if (!PG.STATES[game.stateId]) return null;
      return game;
    } catch (e) {
      return null;
    }
  }

  function remove(slot) {
    adapter.remove(PREFIX + 'save.' + slot);
    writeIndex(
      readIndex().filter(function (m) {
        return m.slot !== slot;
      })
    );
  }

  function list() {
    return readIndex().filter(function (m) {
      return adapter.read(PREFIX + 'save.' + m.slot) !== null;
    });
  }

  function hasAutosave() {
    return load(AUTOSAVE) !== null;
  }

  function clearAll() {
    readIndex().forEach(function (m) {
      adapter.remove(PREFIX + 'save.' + m.slot);
    });
    adapter.remove(INDEX_KEY);
  }

  return {
    AUTOSAVE: AUTOSAVE,
    save: save,
    load: load,
    remove: remove,
    list: list,
    hasAutosave: hasAutosave,
    clearAll: clearAll,
    use: function (a) {
      adapter = a;
    },
    adapterId: function () {
      return adapter.id;
    },
  };
})();


/* ===== src/ui/dom.js ===== */
/**
 * Tiny DOM + formatting helpers shared by every screen.
 * No framework: the game is small enough that direct DOM is clearer, and it
 * keeps the whole thing to a single dependency-free file when bundled.
 */
window.PG = window.PG || {};
PG.ui = PG.ui || {};

PG.ui.dom = (function () {
  'use strict';

  var SVG_NS = 'http://www.w3.org/2000/svg';

  function apply(node, attrs) {
    if (!attrs) return;
    Object.keys(attrs).forEach(function (k) {
      var v = attrs[k];
      if (v === null || v === undefined || v === false) return;
      if (k === 'class') node.setAttribute('class', v);
      else if (k === 'text') node.textContent = v;
      else if (k === 'html') node.innerHTML = v;
      else if (k === 'style' && typeof v === 'object') {
        Object.keys(v).forEach(function (s) {
          // Custom properties only take via setProperty.
          if (s.slice(0, 2) === '--') node.style.setProperty(s, v[s]);
          else node.style[s] = v[s];
        });
      } else if (k.slice(0, 2) === 'on' && typeof v === 'function') {
        node.addEventListener(k.slice(2).toLowerCase(), v);
      } else if (k === 'dataset') {
        Object.keys(v).forEach(function (d) {
          node.dataset[d] = v[d];
        });
      } else {
        node.setAttribute(k, v === true ? '' : v);
      }
    });
  }

  function append(node, children) {
    if (children === null || children === undefined) return;
    if (Array.isArray(children)) {
      children.forEach(function (c) {
        append(node, c);
      });
      return;
    }
    node.appendChild(
      children instanceof Node ? children : document.createTextNode(String(children))
    );
  }

  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    apply(node, attrs);
    append(node, children);
    return node;
  }

  function svg(tag, attrs, children) {
    var node = document.createElementNS(SVG_NS, tag);
    if (attrs) {
      Object.keys(attrs).forEach(function (k) {
        var v = attrs[k];
        if (v === null || v === undefined || v === false) return;
        if (k.slice(0, 2) === 'on' && typeof v === 'function') {
          node.addEventListener(k.slice(2).toLowerCase(), v);
        } else if (k === 'dataset') {
          Object.keys(v).forEach(function (d) {
            node.dataset[d] = v[d];
          });
        } else if (k === 'text') {
          node.textContent = v;
        } else {
          node.setAttribute(k, v);
        }
      });
    }
    append(node, children);
    return node;
  }

  function clear(node) {
    while (node.firstChild) node.removeChild(node.firstChild);
    return node;
  }

  function mount(node, children) {
    clear(node);
    append(node, children);
    return node;
  }

  return { el: el, svg: svg, clear: clear, mount: mount, append: append };
})();

PG.ui.fmt = (function () {
  'use strict';

  function money(game, amount) {
    var cur = PG.getState(game.stateId).currency;
    var n = Math.round(amount * 10) / 10;
    var shown = Math.abs(n - Math.round(n)) < 0.05 ? String(Math.round(n)) : n.toFixed(1);
    return cur.symbol + shown + ' ' + cur.unit;
  }

  function pct(v, dp) {
    return (v || 0).toFixed(dp === undefined ? 1 : dp) + '%';
  }

  function signed(v, dp) {
    var n = v || 0;
    var s = n.toFixed(dp === undefined ? 0 : dp);
    return (n > 0 ? '+' : '') + s;
  }

  function plural(n, one, many) {
    return n === 1 ? one : many || one + 's';
  }

  /** Blend a hex colour toward another by t in 0..1. */
  function mix(hexA, hexB, t) {
    function parse(h) {
      var s = h.replace('#', '');
      if (s.length === 3) s = s[0] + s[0] + s[1] + s[1] + s[2] + s[2];
      return [
        parseInt(s.slice(0, 2), 16),
        parseInt(s.slice(2, 4), 16),
        parseInt(s.slice(4, 6), 16),
      ];
    }
    var a = parse(hexA);
    var b = parse(hexB);
    var out = a.map(function (v, i) {
      return Math.round(v + (b[i] - v) * t);
    });
    return (
      '#' +
      out
        .map(function (v) {
          return ('0' + Math.max(0, Math.min(255, v)).toString(16)).slice(-2);
        })
        .join('')
    );
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  return {
    money: money,
    pct: pct,
    signed: signed,
    plural: plural,
    mix: mix,
    escapeHtml: escapeHtml,
  };
})();


/* ===== src/ui/map.js ===== */
/**
 * The election map.
 * ------------------------------------------------------------------
 * One SVG, two ways of looking at the same 117 seats:
 *   geo  - Voronoi cells over the real outline of Punjab
 *   hex  - one equal tile per seat, so a marginal in Amritsar city is as
 *          easy to click as a 3,000 km2 seat in Fazilka
 *
 * The map only ever renders what the player is allowed to know: it is handed
 * a fogged projection, never the underlying truth.
 */
window.PG = window.PG || {};
PG.ui = PG.ui || {};

PG.ui.map = (function () {
  'use strict';

  var svgEl = PG.ui.dom.svg;
  var el = PG.ui.dom.el;
  var fmt = PG.ui.fmt;

  var BAND_OPACITY = { safe: 1, likely: 0.82, lean: 0.6, tossup: 0.36 };
  var NEUTRAL = '#39415a';

  function create(opts) {
    var stateId = opts.stateId;
    var geo = PG.getState(stateId).geometry();
    var idx = PG.index.get(stateId);

    var view = { x: 0, y: 0, k: 1 };
    var mode = 'geo';
    var colourMode = 'projection';
    var selected = null;
    var focusDistrict = null;
    var hovered = null;
    var projection = null;
    var game = null;

    /* ------------------------------------------------------- scaffolding */

    var cellLayer = svgEl('g', { class: 'map-cells' });
    var borderLayer = svgEl('g', { class: 'map-borders' });
    var labelLayer = svgEl('g', { class: 'map-labels' });
    var highlightLayer = svgEl('g', { class: 'map-highlight' });
    var outlinePath = svgEl('path', {
      class: 'map-outline',
      d: pathFrom(geo.outline, true),
    });

    var zoomGroup = svgEl('g', { class: 'map-zoom' }, [
      outlinePath,
      cellLayer,
      borderLayer,
      highlightLayer,
      labelLayer,
    ]);

    var svg = svgEl(
      'svg',
      {
        class: 'map-svg',
        viewBox: '0 0 ' + geo.viewBox.width + ' ' + geo.viewBox.height,
        preserveAspectRatio: 'xMidYMid meet',
        role: 'application',
        'aria-label': 'Interactive map of ' + PG.getState(stateId).name + ' assembly constituencies',
      },
      [zoomGroup]
    );

    var tooltip = el('div', { class: 'map-tooltip', 'aria-hidden': 'true' });

    var zoomLabel = el('span', { class: 'map-zoom-level', text: '100%' });
    var controls = el('div', { class: 'map-controls' }, [
      el('button', {
        class: 'map-btn',
        type: 'button',
        title: 'Zoom in',
        'aria-label': 'Zoom in',
        text: '+',
        onclick: function () {
          zoomBy(1.4);
        },
      }),
      el('button', {
        class: 'map-btn',
        type: 'button',
        title: 'Zoom out',
        'aria-label': 'Zoom out',
        text: '−',
        onclick: function () {
          zoomBy(1 / 1.4);
        },
      }),
      el('button', {
        class: 'map-btn map-btn-wide',
        type: 'button',
        title: 'Reset view',
        'aria-label': 'Reset view',
        text: 'Reset',
        onclick: reset,
      }),
      zoomLabel,
    ]);

    var root = el('div', { class: 'map-root' }, [svg, tooltip, controls]);

    /* ------------------------------------------------------- geometry */

    function pathFrom(points, close) {
      var d = '';
      for (var i = 0; i < points.length; i++) {
        d += (i === 0 ? 'M' : 'L') + points[i][0] + ' ' + points[i][1];
      }
      return d + (close ? 'Z' : '');
    }

    function shapeFor(seatNum) {
      var g = idx.geoByNum[seatNum];
      if (mode === 'hex') {
        return geo.hexPoints.map(function (p) {
          return [g.hex[0] + p[0], g.hex[1] + p[1]];
        });
      }
      return g.cell;
    }

    function anchorFor(seatNum) {
      var g = idx.geoByNum[seatNum];
      return mode === 'hex' ? g.hex : g.centroid;
    }

    /* ------------------------------------------------------- colouring */

    function fillFor(seatNum) {
      if (!projection) return { fill: NEUTRAL, opacity: 0.5 };
      var entry = projection.bySeat[seatNum];
      var rating = entry.rating;

      if (colourMode === 'battleground') {
        var band = rating.band;
        if (rating.playerLeads) {
          return { fill: PG.PARTY_BY_ID[game.player.partyId].colour, opacity: BAND_OPACITY[band] };
        }
        if (band === 'tossup' || band === 'lean') {
          return { fill: '#e8b230', opacity: band === 'tossup' ? 0.85 : 0.6 };
        }
        return { fill: '#6b7590', opacity: band === 'safe' ? 0.75 : 0.5 };
      }

      if (colourMode === 'campaign') {
        var spend = (game.seats[seatNum].spend[game.player.partyId] || 0);
        var t = Math.min(1, spend / 14);
        if (t <= 0.001) return { fill: NEUTRAL, opacity: 0.35 };
        return {
          fill: fmt.mix('#4b5570', PG.PARTY_BY_ID[game.player.partyId].colour, t),
          opacity: 0.45 + t * 0.55,
        };
      }

      return {
        fill: PG.PARTY_BY_ID[rating.leader].colour,
        opacity: BAND_OPACITY[rating.band],
      };
    }

    /* ------------------------------------------------------- rendering */

    var cellNodes = {};

    function buildCells() {
      PG.ui.dom.clear(cellLayer);
      cellNodes = {};
      idx.seatDefs.forEach(function (def) {
        var node = svgEl('path', {
          class: 'map-cell',
          d: pathFrom(shapeFor(def.num), true),
          dataset: { seat: def.num },
          tabindex: '-1',
        });
        cellNodes[def.num] = node;
        cellLayer.appendChild(node);
      });
    }

    function buildBorders() {
      PG.ui.dom.clear(borderLayer);
      idx.districtOrder.forEach(function (name) {
        var d = geo.districts[name];
        var lines = mode === 'hex' ? d.hexBorder : d.border;
        lines.forEach(function (line) {
          borderLayer.appendChild(
            svgEl('path', {
              class: 'map-district-border',
              d: pathFrom(line, false),
              dataset: { district: name },
            })
          );
        });
      });
    }

    function buildLabels() {
      PG.ui.dom.clear(labelLayer);
      idx.districtOrder.forEach(function (name) {
        var d = geo.districts[name];
        var c = mode === 'hex' ? d.hexCentroid : d.centroid;
        labelLayer.appendChild(
          svgEl('text', {
            class: 'map-district-label',
            x: c.x,
            y: c.y,
            'text-anchor': 'middle',
            dataset: { district: name },
            text: (PG.index.district(stateId, name) || {}).short || name,
          })
        );
      });
      idx.seatDefs.forEach(function (def) {
        var a = anchorFor(def.num);
        labelLayer.appendChild(
          svgEl('text', {
            class: 'map-seat-label',
            x: a[0],
            y: a[1],
            'text-anchor': 'middle',
            'dominant-baseline': 'central',
            dataset: { seat: def.num },
            text: def.num,
          })
        );
      });
    }

    function paint() {
      idx.seatDefs.forEach(function (def) {
        var node = cellNodes[def.num];
        if (!node) return;
        var c = fillFor(def.num);
        node.setAttribute('fill', c.fill);
        node.setAttribute('fill-opacity', c.opacity);
        var dim = focusDistrict && def.district !== focusDistrict;
        node.classList.toggle('is-dimmed', !!dim);
        node.classList.toggle('is-selected', selected === def.num);
      });

      PG.ui.dom.clear(highlightLayer);
      if (selected !== null && cellNodes[selected]) {
        highlightLayer.appendChild(
          svgEl('path', {
            class: 'map-selection',
            d: pathFrom(shapeFor(selected), true),
          })
        );
      }
      if (focusDistrict) {
        var d = geo.districts[focusDistrict];
        (mode === 'hex' ? d.hexBorder : d.border).forEach(function (line) {
          highlightLayer.appendChild(
            svgEl('path', { class: 'map-district-focus', d: pathFrom(line, false) })
          );
        });
      }

      updateLabelVisibility();
    }

    function updateLabelVisibility() {
      var showSeats = view.k >= 2.6 || mode === 'hex';
      var showDistricts = view.k < 4.5;
      labelLayer.classList.toggle('show-seats', showSeats);
      labelLayer.classList.toggle('show-districts', showDistricts);
      labelLayer.setAttribute('style', '--map-k:' + view.k);
    }

    /* ------------------------------------------------------- zoom + pan */

    function applyView() {
      zoomGroup.setAttribute(
        'transform',
        'translate(' + view.x + ' ' + view.y + ') scale(' + view.k + ')'
      );
      zoomLabel.textContent = Math.round(view.k * 100) + '%';
      updateLabelVisibility();
    }

    function clampView() {
      var w = geo.viewBox.width;
      var h = geo.viewBox.height;
      var maxX = w * (view.k - 1);
      var maxY = h * (view.k - 1);
      view.x = Math.min(0, Math.max(-maxX, view.x));
      view.y = Math.min(0, Math.max(-maxY, view.y));
    }

    function zoomAt(px, py, factor) {
      var k2 = Math.max(1, Math.min(14, view.k * factor));
      if (k2 === view.k) return;
      var ratio = k2 / view.k;
      view.x = px - (px - view.x) * ratio;
      view.y = py - (py - view.y) * ratio;
      view.k = k2;
      clampView();
      applyView();
    }

    function zoomBy(factor) {
      zoomAt(geo.viewBox.width / 2, geo.viewBox.height / 2, factor);
    }

    function reset() {
      view = { x: 0, y: 0, k: 1 };
      focusDistrict = null;
      applyView();
      paint();
    }

    function toLocal(clientX, clientY) {
      var ctm = svg.getScreenCTM();
      if (!ctm) return { x: 0, y: 0 };
      var pt = svg.createSVGPoint();
      pt.x = clientX;
      pt.y = clientY;
      var p = pt.matrixTransform(ctm.inverse());
      return { x: p.x, y: p.y };
    }

    svg.addEventListener(
      'wheel',
      function (e) {
        e.preventDefault();
        var p = toLocal(e.clientX, e.clientY);
        zoomAt(p.x, p.y, e.deltaY < 0 ? 1.18 : 1 / 1.18);
      },
      { passive: false }
    );

    var pointers = {};
    var dragStart = null;
    var pinchStart = null;
    var moved = 0;

    svg.addEventListener('pointerdown', function (e) {
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pointers);
      if (ids.length === 1) {
        moved = 0;
        var p = toLocal(e.clientX, e.clientY);
        dragStart = { px: p.x, py: p.y, vx: view.x, vy: view.y };
        svg.setPointerCapture(e.pointerId);
        svg.classList.add('is-dragging');
      } else if (ids.length === 2) {
        var a = pointers[ids[0]];
        var b = pointers[ids[1]];
        pinchStart = {
          dist: Math.hypot(a.x - b.x, a.y - b.y),
          k: view.k,
        };
        dragStart = null;
      }
    });

    svg.addEventListener('pointermove', function (e) {
      if (!pointers[e.pointerId]) return;
      pointers[e.pointerId] = { x: e.clientX, y: e.clientY };
      var ids = Object.keys(pointers);

      if (ids.length >= 2 && pinchStart) {
        var a = pointers[ids[0]];
        var b = pointers[ids[1]];
        var dist = Math.hypot(a.x - b.x, a.y - b.y);
        if (pinchStart.dist > 0) {
          var mid = toLocal((a.x + b.x) / 2, (a.y + b.y) / 2);
          var target = pinchStart.k * (dist / pinchStart.dist);
          zoomAt(mid.x, mid.y, Math.max(1, Math.min(14, target)) / view.k);
        }
        return;
      }

      if (dragStart) {
        var p = toLocal(e.clientX, e.clientY);
        // Keep the model point that was under the cursor at drag start under it.
        view.x = dragStart.vx + (p.x - dragStart.px);
        view.y = dragStart.vy + (p.y - dragStart.py);
        moved = Math.abs(p.x - dragStart.px) + Math.abs(p.y - dragStart.py);
        hideTooltip();
        clampView();
        applyView();
      }
    });

    function endPointer(e) {
      delete pointers[e.pointerId];
      if (Object.keys(pointers).length < 2) pinchStart = null;
      if (Object.keys(pointers).length === 0) {
        dragStart = null;
        svg.classList.remove('is-dragging');
      }
    }
    svg.addEventListener('pointerup', endPointer);
    svg.addEventListener('pointercancel', endPointer);
    svg.addEventListener('pointerleave', function (e) {
      endPointer(e);
      hideTooltip();
    });

    /* ------------------------------------------------------- interaction */

    function seatFromEvent(e) {
      var t = e.target;
      if (t && t.dataset && t.dataset.seat) return +t.dataset.seat;
      return null;
    }

    svg.addEventListener('click', function (e) {
      if (moved > 6) return; // that was a drag, not a click
      var num = seatFromEvent(e);
      if (num === null) {
        var district = e.target && e.target.dataset && e.target.dataset.district;
        if (district && opts.onDistrict) opts.onDistrict(district);
        return;
      }
      select(num, { notify: true });
    });

    svg.addEventListener('dblclick', function (e) {
      var p = toLocal(e.clientX, e.clientY);
      zoomAt(p.x, p.y, 1.8);
    });

    function handleHover(e) {
      if (dragStart || pinchStart) return; // no tooltips mid-drag
      var num = seatFromEvent(e);
      if (num === hovered) {
        if (num !== null) moveTooltip(e);
        return;
      }
      if (hovered !== null && cellNodes[hovered]) {
        cellNodes[hovered].classList.remove('is-hovered');
      }
      hovered = num;
      if (num === null) {
        hideTooltip();
        return;
      }
      cellNodes[num].classList.add('is-hovered');
      showTooltip(num, e);
    }

    svg.addEventListener('pointermove', handleHover);

    /* ------------------------------------------------------- tooltip */

    function showTooltip(num, e) {
      if (!projection) return;
      var def = idx.byNum[num];
      var entry = projection.bySeat[num];
      var ranked = entry.rating.ranked.slice(0, 3);
      tooltip.innerHTML = '';
      tooltip.appendChild(
        el('div', { class: 'tt-head' }, [
          el('span', { class: 'tt-num', text: '#' + def.num }),
          el('strong', { text: def.name }),
          def.reservation === 'SC' ? el('span', { class: 'tt-tag', text: 'SC' }) : null,
        ])
      );
      tooltip.appendChild(
        el('div', { class: 'tt-sub', text: def.district + ' · ' + def.region })
      );
      tooltip.appendChild(
        el(
          'div',
          { class: 'tt-bars' },
          ranked.map(function (r) {
            var p = PG.PARTY_BY_ID[r.id];
            return el('div', { class: 'tt-bar-row' }, [
              el('span', { class: 'tt-party', text: p.short }),
              el('span', { class: 'tt-track' }, [
                el('span', {
                  class: 'tt-fill',
                  style: { width: Math.max(2, r.share * 1.6) + '%', background: p.colour },
                }),
              ]),
              el('span', { class: 'tt-val', text: fmt.pct(r.share, 0) }),
            ]);
          })
        )
      );
      tooltip.appendChild(
        el('div', { class: 'tt-foot rating-' + entry.rating.band }, [
          el('span', { text: entry.rating.bandLabel + ' ' + PG.PARTY_BY_ID[entry.rating.leader].short }),
        ])
      );
      tooltip.classList.add('is-visible');
      moveTooltip(e);
    }

    function moveTooltip(e) {
      var box = root.getBoundingClientRect();
      var x = e.clientX - box.left + 16;
      var y = e.clientY - box.top + 16;
      var tw = tooltip.offsetWidth || 210;
      var th = tooltip.offsetHeight || 120;
      if (x + tw > box.width - 8) x = e.clientX - box.left - tw - 16;
      if (y + th > box.height - 8) y = e.clientY - box.top - th - 16;
      tooltip.style.transform = 'translate(' + Math.max(4, x) + 'px,' + Math.max(4, y) + 'px)';
    }

    function hideTooltip() {
      tooltip.classList.remove('is-visible');
      if (hovered !== null && cellNodes[hovered]) cellNodes[hovered].classList.remove('is-hovered');
      hovered = null;
    }

    /* ------------------------------------------------------- public api */

    function select(num, o) {
      selected = num;
      paint();
      if (o && o.notify && opts.onSelect) opts.onSelect(num);
    }

    function focusOn(districtName, o) {
      focusDistrict = districtName || null;
      if (districtName && o && o.zoom !== false) {
        var d = geo.districts[districtName];
        var c = mode === 'hex' ? d.hexCentroid : d.centroid;
        var k = mode === 'hex' ? 2.2 : 3;
        view.k = k;
        view.x = geo.viewBox.width / 2 - c.x * k;
        view.y = geo.viewBox.height / 2 - c.y * k;
        clampView();
        applyView();
      }
      paint();
    }

    function setMode(next) {
      if (next === mode) return;
      mode = next;
      buildCells();
      buildBorders();
      buildLabels();
      reset();
    }

    function setColourMode(next) {
      colourMode = next;
      paint();
    }

    function update(nextGame, nextProjection) {
      game = nextGame;
      projection = nextProjection;
      paint();
    }

    buildCells();
    buildBorders();
    buildLabels();
    applyView();

    return {
      root: root,
      update: update,
      select: select,
      focusOn: focusOn,
      setMode: setMode,
      setColourMode: setColourMode,
      reset: reset,
      getMode: function () {
        return mode;
      },
      getColourMode: function () {
        return colourMode;
      },
      getSelected: function () {
        return selected;
      },
    };
  }

  return { create: create, BAND_OPACITY: BAND_OPACITY };
})();


/* ===== src/ui/hud.js ===== */
/**
 * Top bar and seat meter.
 * ------------------------------------------------------------------
 * The one thing that must always be readable at a glance: how many seats am
 * I projected to win, and how far is that from a majority.
 */
window.PG = window.PG || {};
PG.ui = PG.ui || {};

PG.ui.hud = (function () {
  'use strict';

  var el = PG.ui.dom.el;
  var fmt = PG.ui.fmt;

  function create(opts) {
    var stat = {};

    function statBlock(id, label, extraClass) {
      var value = el('span', { class: 'stat-value', text: '—' });
      var sub = el('span', { class: 'stat-sub' });
      stat[id] = { value: value, sub: sub };
      return el('div', { class: 'stat' + (extraClass ? ' ' + extraClass : '') }, [
        el('span', { class: 'stat-label', text: label }),
        value,
        sub,
      ]);
    }

    var meterFill = el('span', { class: 'meter-fill' });
    var meterMarker = el('span', { class: 'meter-marker' }, [
      el('span', { class: 'meter-marker-label' }),
    ]);
    var meterTrack = el('div', { class: 'meter-track' }, [meterFill, meterMarker]);

    var meterHead = el('div', { class: 'meter-head' }, [
      el('div', { class: 'meter-primary' }, [
        el('span', { class: 'meter-number', text: '—' }),
        el('span', { class: 'meter-of', text: '' }),
      ]),
      el('div', { class: 'meter-need' }, [
        el('span', { class: 'meter-need-value', text: '—' }),
        el('span', { class: 'meter-need-label', text: 'still needed' }),
      ]),
    ]);

    var meter = el('div', { class: 'seat-meter' }, [meterHead, meterTrack]);

    var titleEl = el('div', { class: 'hud-title' }, [
      el('span', { class: 'hud-election', text: 'Punjab Assembly Election' }),
      el('span', { class: 'hud-sub', text: '' }),
    ]);

    var phasePill = el('span', { class: 'phase-pill', text: '' });

    var menuBtn = el('button', {
      class: 'btn btn-ghost',
      type: 'button',
      text: 'Menu',
      onclick: function () {
        if (opts.onMenu) opts.onMenu();
      },
    });

    var saveBtn = el('button', {
      class: 'btn btn-ghost',
      type: 'button',
      text: 'Save',
      onclick: function () {
        if (opts.onSave) opts.onSave();
      },
    });

    var root = el('header', { class: 'hud' }, [
      el('div', { class: 'hud-left' }, [titleEl, phasePill]),
      el('div', { class: 'hud-meter' }, [meter]),
      el('div', { class: 'hud-right' }, [
        el('div', { class: 'stat-row' }, [
          statBlock('week', 'Week'),
          statBlock('budget', 'In hand', 'stat-money'),
          statBlock('actions', 'Actions'),
        ]),
        el('div', { class: 'hud-buttons' }, [saveBtn, menuBtn]),
      ]),
    ]);

    function render(game, projection) {
      var stateDef = PG.getState(game.stateId);
      var party = PG.PARTY_BY_ID[game.player.partyId];
      var phase = PG.engine.phaseFor(stateDef, game.turn);
      var majority = projection.majority;
      var seats = projection.playerSeats;
      var needed = Math.max(0, majority - seats);

      titleEl.querySelector('.hud-sub').textContent =
        game.player.name + ' · ' + party.name;
      titleEl.style.setProperty('--party-colour', party.colour);

      phasePill.textContent =
        game.status === 'results'
          ? 'Result declared'
          : game.status === 'electionDay'
          ? 'Election Day'
          : phase.label;
      phasePill.className = 'phase-pill phase-' + (game.status === 'campaign' ? phase.id : game.status);

      stat.week.value.textContent =
        game.status === 'campaign' ? game.turn + ' / ' + stateDef.campaign.turns : '—';
      stat.week.sub.textContent =
        game.status === 'campaign'
          ? PG.engine.turnsLeft(game) + ' to go'
          : 'campaign closed';

      stat.budget.value.textContent = fmt.money(game, PG.engine.moneyLeft(game));
      stat.budget.sub.textContent = fmt.money(game, game.budget.spent) + ' spent';

      stat.actions.value.textContent =
        game.status === 'campaign'
          ? game.actionsLeft + ' / ' + stateDef.campaign.actionsPerTurn
          : '—';
      stat.actions.sub.textContent = 'this week';

      meterHead.querySelector('.meter-number').textContent = seats;
      meterHead.querySelector('.meter-of').textContent =
        'projected of ' + projection.total;
      meterHead.querySelector('.meter-need-value').textContent = needed;
      meterHead.querySelector('.meter-need-label').textContent =
        needed === 0 ? 'majority reached' : 'still needed for ' + majority;
      meterHead.classList.toggle('is-majority', needed === 0);

      meterFill.style.width = (seats / projection.total) * 100 + '%';
      meterFill.style.background = party.colour;
      meterMarker.style.left = (majority / projection.total) * 100 + '%';
      meterMarker.querySelector('.meter-marker-label').textContent = majority;
      meter.classList.toggle('is-majority', needed === 0);
    }

    return { root: root, render: render };
  }

  return { create: create };
})();


/* ===== src/ui/panel.js ===== */
/**
 * The campaign panel (right-hand column).
 * ------------------------------------------------------------------
 * Four tabs over the same game state:
 *   Target    - the selected constituency or district, plus what you can do there
 *   Districts - the whole state as a sortable table, for spotting where to go
 *   Briefing  - the news feed
 *   Standings - projected seats, vote share and how the map breaks down
 *
 * The panel shows ratings, bands and qualitative strength rather than raw
 * model numbers: enough to decide with, not enough to solve.
 */
window.PG = window.PG || {};
PG.ui = PG.ui || {};

PG.ui.panel = (function () {
  'use strict';

  var el = PG.ui.dom.el;
  var mount = PG.ui.dom.mount;
  var fmt = PG.ui.fmt;

  var STRENGTH = [
    { max: 0.4, label: 'No presence', hint: 'You have not campaigned here.' },
    { max: 4, label: 'Light touch', hint: 'A start, but barely visible on the ground.' },
    { max: 10, label: 'Active', hint: 'Your campaign is being felt here.' },
    { max: 18, label: 'Heavy', hint: 'A serious effort. Returns are starting to flatten.' },
    { max: Infinity, label: 'Saturated', hint: 'More money here buys very little now.' },
  ];

  function strengthFor(points) {
    for (var i = 0; i < STRENGTH.length; i++) {
      if (points <= STRENGTH[i].max) return STRENGTH[i];
    }
    return STRENGTH[STRENGTH.length - 1];
  }

  function create(opts) {
    var tab = 'target';
    var game = null;
    var projection = null;
    var selection = { seat: null, district: null, region: null };
    var pendingAction = null; // action awaiting an issue / region choice
    var sortKey = 'name';
    var sortDir = 1;

    var body = el('div', { class: 'panel-body' });

    var tabs = [
      { id: 'target', label: 'Target' },
      { id: 'districts', label: 'Districts' },
      { id: 'briefing', label: 'Briefing' },
      { id: 'standings', label: 'Standings' },
    ];

    var tabBar = el(
      'div',
      { class: 'panel-tabs', role: 'tablist' },
      tabs.map(function (t) {
        return el('button', {
          class: 'panel-tab',
          type: 'button',
          role: 'tab',
          dataset: { tab: t.id },
          text: t.label,
          onclick: function () {
            setTab(t.id);
          },
        });
      })
    );

    var root = el('aside', { class: 'panel' }, [tabBar, body]);

    function setTab(id) {
      tab = id;
      Array.prototype.forEach.call(tabBar.children, function (b) {
        var on = b.dataset.tab === id;
        b.classList.toggle('is-active', on);
        b.setAttribute('aria-selected', on ? 'true' : 'false');
      });
      render();
    }

    /* ------------------------------------------------------ helpers */

    function shareBars(shares, limit) {
      var ranked = PG.model.rank(shares).slice(0, limit || 4);
      return el(
        'div',
        { class: 'share-bars' },
        ranked.map(function (r) {
          var p = PG.PARTY_BY_ID[r.id];
          var isPlayer = r.id === game.player.partyId;
          return el('div', { class: 'share-row' + (isPlayer ? ' is-you' : '') }, [
            el('span', { class: 'share-name', text: p.short }),
            el('span', { class: 'share-track' }, [
              el('span', {
                class: 'share-fill',
                style: { width: Math.max(1.5, r.share * 1.7) + '%', background: p.colour },
              }),
            ]),
            el('span', { class: 'share-val', text: fmt.pct(r.share, 1) }),
          ]);
        })
      );
    }

    function ratingChip(rating) {
      var leader = PG.PARTY_BY_ID[rating.leader];
      return el('span', { class: 'chip rating-' + rating.band }, [
        el('span', { class: 'chip-dot', style: { background: leader.colour } }),
        rating.bandLabel + ' ' + leader.short,
      ]);
    }

    function momentumLabel(v) {
      if (v >= 1.2) return { label: 'Surging', cls: 'good' };
      if (v >= 0.5) return { label: 'Building', cls: 'good' };
      if (v <= -1.2) return { label: 'Falling', cls: 'bad' };
      if (v <= -0.5) return { label: 'Slipping', cls: 'bad' };
      return { label: 'Steady', cls: 'flat' };
    }

    /* ------------------------------------------------------ actions */

    function targetForAction(action) {
      if (action.scope === 'seat') return selection.seat ? { seat: selection.seat } : null;
      if (action.scope === 'district') {
        var d =
          selection.district ||
          (selection.seat ? PG.index.seatDef(game.stateId, selection.seat).district : null);
        return d ? { district: d } : null;
      }
      if (action.scope === 'region') {
        var r =
          selection.region ||
          (selection.seat ? PG.index.seatDef(game.stateId, selection.seat).region : null) ||
          (selection.district
            ? PG.index.district(game.stateId, selection.district).region
            : null);
        return r ? { region: r } : null;
      }
      return null;
    }

    function runAction(action, target) {
      var res = PG.engine.play(game, action.id, target);
      if (!res.ok) {
        opts.onToast({ tone: 'bad', text: res.reason });
        return;
      }
      pendingAction = null;
      opts.onAction(res, action, target);
    }

    function actionCard(action) {
      var pid = game.player.partyId;
      var cost = PG.actions.costOf(game, pid, action.id);
      var left = PG.actions.usesLeft(game, pid, action.id);
      var target = targetForAction(action);
      var check = target
        ? PG.engine.canPlay(game, action.id, target)
        : { ok: false, reason: 'Select a ' + action.scope + ' first' };

      var scopeWord =
        action.scope === 'seat'
          ? target
            ? PG.index.seatDef(game.stateId, target.seat).name
            : 'a constituency'
          : action.scope === 'district'
          ? target
            ? target.district + ' district'
            : 'a district'
          : target
          ? target.region + ' region'
          : 'a region';

      return el(
        'button',
        {
          class: 'action-card' + (check.ok ? '' : ' is-disabled'),
          type: 'button',
          disabled: !check.ok,
          title: check.ok ? action.detail : check.reason,
          onclick: function () {
            if (!check.ok) return;
            if (action.needsIssue) {
              pendingAction = { action: action, target: target };
              render();
              return;
            }
            runAction(action, target);
          },
        },
        [
          el('span', { class: 'action-icon', text: action.icon }),
          el('span', { class: 'action-main' }, [
            el('span', { class: 'action-label' }, [
              action.label,
              left !== null ? el('span', { class: 'action-uses', text: left + ' left' }) : null,
            ]),
            el('span', { class: 'action-blurb', text: action.blurb }),
            el('span', { class: 'action-meta' }, [
              el('span', { class: 'action-scope', text: scopeWord }),
              el('span', { class: 'action-tempo', text: action.tempo }),
            ]),
          ]),
          el('span', { class: 'action-cost' }, [
            el('span', { class: 'action-cost-value', text: fmt.money(game, cost) }),
            !check.ok ? el('span', { class: 'action-why', text: check.reason }) : null,
          ]),
        ]
      );
    }

    function issuePicker() {
      var action = pendingAction.action;
      var target = pendingAction.target;
      var seat = game.seats[target.seat];
      var def = PG.index.seatDef(game.stateId, target.seat);
      var party = PG.PARTY_BY_ID[game.player.partyId];

      var ranked = PG.ISSUES.slice().sort(function (a, b) {
        return seat.issueSalience[b.id] - seat.issueSalience[a.id];
      });

      return el('div', { class: 'issue-picker' }, [
        el('div', { class: 'picker-head' }, [
          el('strong', { text: 'What do you promise ' + def.name + '?' }),
          el('button', {
            class: 'btn btn-ghost btn-small',
            type: 'button',
            text: 'Cancel',
            onclick: function () {
              pendingAction = null;
              render();
            },
          }),
        ]),
        el('p', {
          class: 'picker-hint',
          text:
            'A promise only pays if it matches what this seat cares about — and ' +
            party.short +
            ' is more convincing on some issues than others.',
        }),
        el(
          'div',
          { class: 'issue-list' },
          ranked.map(function (issue) {
            var sal = seat.issueSalience[issue.id];
            var cred = party.credibility[issue.id] || 0.5;
            return el(
              'button',
              {
                class: 'issue-row',
                type: 'button',
                onclick: function () {
                  runAction(action, { seat: target.seat, issue: issue.id });
                },
              },
              [
                el('span', { class: 'issue-icon', text: issue.icon }),
                el('span', { class: 'issue-main' }, [
                  el('span', { class: 'issue-label', text: issue.label }),
                  el('span', { class: 'issue-meters' }, [
                    el('span', { class: 'meter-mini' }, [
                      el('span', { class: 'meter-mini-label', text: 'Local concern' }),
                      el('span', { class: 'meter-mini-track' }, [
                        el('span', {
                          class: 'meter-mini-fill',
                          style: { width: Math.min(100, sal * 55) + '%' },
                        }),
                      ]),
                    ]),
                    el('span', { class: 'meter-mini' }, [
                      el('span', { class: 'meter-mini-label', text: 'Your credibility' }),
                      el('span', { class: 'meter-mini-track' }, [
                        el('span', {
                          class: 'meter-mini-fill is-party',
                          style: { width: cred * 100 + '%', background: party.colour },
                        }),
                      ]),
                    ]),
                  ]),
                ]),
              ]
            );
          })
        ),
      ]);
    }

    /* ------------------------------------------------------ target tab */

    function seatView(num) {
      var def = PG.index.seatDef(game.stateId, num);
      var seat = game.seats[num];
      var entry = projection.bySeat[num];
      var pid = game.player.partyId;
      var points = (seat.camp[pid] || 0) + (seat.ground[pid] || 0) * 0.75;
      var strength = strengthFor(points);
      var spend = seat.spend[pid] || 0;
      var topIssues = PG.ISSUES.slice()
        .sort(function (a, b) {
          return seat.issueSalience[b.id] - seat.issueSalience[a.id];
        })
        .slice(0, 3);

      return [
        el('div', { class: 'seat-head' }, [
          el('div', { class: 'seat-title' }, [
            el('span', { class: 'seat-num', text: '#' + def.num }),
            el('h2', { text: def.name }),
            def.reservation === 'SC' ? el('span', { class: 'tag', text: 'SC' }) : null,
          ]),
          el('div', { class: 'seat-sub' }, [
            el('button', {
              class: 'link-btn',
              type: 'button',
              text: def.district + ' district',
              onclick: function () {
                opts.onSelectDistrict(def.district);
              },
            }),
            el('span', { text: ' · ' + def.region + ' · ' + def.settlement }),
          ]),
        ]),
        el('div', { class: 'seat-rating' }, [
          ratingChip(entry.rating),
          el('span', {
            class: 'seat-gap',
            text: entry.rating.playerLeads
              ? 'You lead by ' + fmt.pct(entry.rating.margin, 1)
              : 'You trail by ' + fmt.pct(entry.rating.gap, 1),
          }),
        ]),
        shareBars(entry.shares),
        el('div', { class: 'sub-head', text: 'What matters here' }),
        el(
          'div',
          { class: 'issue-chips' },
          topIssues.map(function (issue) {
            return el('span', { class: 'issue-chip' }, [
              el('span', { text: issue.icon + ' ' + issue.label }),
              el('span', { class: 'issue-chip-track' }, [
                el('span', {
                  class: 'issue-chip-fill',
                  style: { width: Math.min(100, seat.issueSalience[issue.id] * 55) + '%' },
                }),
              ]),
            ]);
          })
        ),
        el('div', { class: 'kv-grid' }, [
          kv('Sitting member', PG.PARTY_BY_ID[seat.incumbent].short),
          kv('Your presence', strength.label),
          kv('Spent here', fmt.money(game, spend)),
          kv('Local mood', PG.ISSUE_BY_ID[seat.localIssue].label),
        ]),
        el('p', { class: 'muted-note', text: strength.hint }),
      ];
    }

    function kv(k, v) {
      return el('div', { class: 'kv' }, [
        el('span', { class: 'kv-k', text: k }),
        el('span', { class: 'kv-v', text: v }),
      ]);
    }

    function districtView(name) {
      var summary = PG.model.districtSummary(game, projection, name);
      var mom = momentumLabel(summary.momentum);
      var pid = game.player.partyId;

      return [
        el('div', { class: 'seat-head' }, [
          el('div', { class: 'seat-title' }, [el('h2', { text: name + ' district' })]),
          el('div', { class: 'seat-sub', text: summary.region + ' region' }),
        ]),
        el('div', { class: 'kv-grid kv-grid-4' }, [
          kv('Seats', String(summary.seats)),
          kv('Projected yours', String(summary.player)),
          kv('Competitive', String(summary.competitive)),
          kv('Spent', fmt.money(game, summary.spend)),
        ]),
        el('div', { class: 'district-momentum ' + mom.cls }, [
          el('span', { class: 'kv-k', text: 'Momentum' }),
          el('span', { class: 'kv-v', text: mom.label }),
        ]),
        el('div', { class: 'sub-head', text: 'Constituencies' }),
        el(
          'div',
          { class: 'seat-list' },
          summary.seatList.map(function (num) {
            var def = PG.index.seatDef(game.stateId, num);
            var entry = projection.bySeat[num];
            var leader = PG.PARTY_BY_ID[entry.rating.leader];
            return el(
              'button',
              {
                class:
                  'seat-list-row' +
                  (entry.rating.playerLeads ? ' is-yours' : '') +
                  (selection.seat === num ? ' is-selected' : ''),
                type: 'button',
                onclick: function () {
                  opts.onSelectSeat(num);
                },
              },
              [
                el('span', { class: 'slr-num', text: def.num }),
                el('span', { class: 'slr-name', text: def.name }),
                el('span', {
                  class: 'slr-band rating-' + entry.rating.band,
                  text: entry.rating.bandLabel,
                }),
                el('span', {
                  class: 'slr-leader',
                  style: { color: leader.colour },
                  text: leader.short,
                }),
              ]
            );
          })
        ),
      ];
    }

    function targetTab() {
      var head;
      if (pendingAction) return [issuePicker()];

      if (selection.seat) head = seatView(selection.seat);
      else if (selection.district) head = districtView(selection.district);
      else
        head = [
          el('div', { class: 'empty-state' }, [
            el('h2', { text: 'Pick somewhere to campaign' }),
            el('p', {
              text:
                'Click a constituency on the map, or open the Districts tab to find where you are weakest.',
            }),
          ]),
        ];

      var applicable = PG.actions.catalogue.filter(function (a) {
        if (selection.seat) return true;
        if (selection.district) return a.scope !== 'seat';
        return false;
      });

      return head.concat([
        el('div', { class: 'sub-head', text: 'Campaign actions' }),
        game.status !== 'campaign'
          ? el('p', { class: 'muted-note', text: 'Campaigning has closed.' })
          : el('div', { class: 'action-list' }, applicable.map(actionCard)),
      ]);
    }

    /* ------------------------------------------------------ districts tab */

    function districtsTab() {
      var rows = PG.index.districtOrder(game.stateId).map(function (name) {
        return PG.model.districtSummary(game, projection, name);
      });

      var cols = [
        { key: 'name', label: 'District', align: 'left' },
        { key: 'seats', label: 'Seats' },
        { key: 'player', label: 'You' },
        { key: 'competitive', label: 'Comp.' },
        { key: 'spend', label: 'Spent' },
        { key: 'momentum', label: 'Mom.' },
      ];

      rows.sort(function (a, b) {
        var av = a[sortKey];
        var bv = b[sortKey];
        if (typeof av === 'string') return av.localeCompare(bv) * sortDir;
        return (av - bv) * sortDir;
      });

      return [
        el('p', {
          class: 'panel-intro',
          text: 'Where your seats are, and where they are not. Click a row to zoom the map.',
        }),
        el('div', { class: 'table-wrap' }, [
          el('table', { class: 'data-table' }, [
            el('thead', {}, [
              el(
                'tr',
                {},
                cols.map(function (c) {
                  return el('th', {
                    class:
                      (c.align === 'left' ? 'ta-left' : '') +
                      (sortKey === c.key ? ' is-sorted' : ''),
                    text: c.label,
                    onclick: function () {
                      if (sortKey === c.key) sortDir = -sortDir;
                      else {
                        sortKey = c.key;
                        sortDir = c.key === 'name' ? 1 : -1;
                      }
                      render();
                    },
                  });
                })
              ),
            ]),
            el(
              'tbody',
              {},
              rows.map(function (r) {
                var mom = momentumLabel(r.momentum);
                return el(
                  'tr',
                  {
                    class: selection.district === r.name ? 'is-selected' : '',
                    onclick: function () {
                      opts.onSelectDistrict(r.name);
                    },
                  },
                  [
                    el('td', { class: 'ta-left' }, [
                      el('span', { class: 'dt-name', text: r.name }),
                      el('span', { class: 'dt-region', text: r.region }),
                    ]),
                    el('td', { text: r.seats }),
                    el('td', { class: 'dt-you', text: r.player }),
                    el('td', { text: r.competitive }),
                    el('td', { text: r.spend > 0 ? fmt.money(game, r.spend) : '—' }),
                    el('td', { class: 'mom-' + mom.cls, text: mom.label }),
                  ]
                );
              })
            ),
          ]),
        ]),
      ];
    }

    /* ------------------------------------------------------ briefing tab */

    function briefingTab() {
      if (!game.feed.length) {
        return [el('div', { class: 'empty-state' }, [el('p', { text: 'Nothing yet.' })])];
      }
      return [
        el('p', { class: 'panel-intro', text: 'Everything your campaign has heard.' }),
        el(
          'div',
          { class: 'feed' },
          game.feed.slice(0, 60).map(function (entry) {
            var clickable = entry.seat || entry.district;
            return el(
              'div',
              {
                class:
                  'feed-item tone-' + entry.tone + ' kind-' + entry.kind +
                  (clickable ? ' is-clickable' : ''),
                onclick: clickable
                  ? function () {
                      if (entry.seat) opts.onSelectSeat(entry.seat);
                      else opts.onSelectDistrict(entry.district);
                    }
                  : null,
              },
              [
                el('div', { class: 'feed-meta' }, [
                  el('span', { class: 'feed-week', text: 'Week ' + entry.turn }),
                  el('span', { class: 'feed-kind', text: entry.kind }),
                ]),
                el('div', { class: 'feed-title', text: entry.title }),
                entry.text ? el('div', { class: 'feed-text', text: entry.text }) : null,
              ]
            );
          })
        ),
      ];
    }

    /* ------------------------------------------------------ standings tab */

    function standingsTab() {
      var ranked = PG.PARTIES.slice().sort(function (a, b) {
        return (projection.counts[b.id] || 0) - (projection.counts[a.id] || 0);
      });
      var stateDef = PG.getState(game.stateId);
      var regions = stateDef.regions();
      var pid = game.player.partyId;

      var regionRows = Object.keys(regions).map(function (rName) {
        var mine = 0;
        var comp = 0;
        regions[rName].seats.forEach(function (n) {
          var r = projection.bySeat[n].rating;
          if (r.playerLeads) mine++;
          if (r.band === 'tossup' || r.band === 'lean') comp++;
        });
        return { name: rName, seats: regions[rName].seats.length, mine: mine, comp: comp };
      });

      return [
        el('p', { class: 'panel-intro', text: 'Projected result if the vote were held today.' }),
        el(
          'div',
          { class: 'standings' },
          ranked.map(function (p) {
            var seats = projection.counts[p.id] || 0;
            return el('div', { class: 'standing-row' + (p.id === pid ? ' is-you' : '') }, [
              el('span', { class: 'standing-name' }, [
                el('span', { class: 'standing-dot', style: { background: p.colour } }),
                p.short,
              ]),
              el('span', { class: 'standing-track' }, [
                el('span', {
                  class: 'standing-fill',
                  style: {
                    width: (seats / projection.total) * 100 + '%',
                    background: p.colour,
                  },
                }),
              ]),
              el('span', { class: 'standing-seats', text: seats }),
              el('span', { class: 'standing-vote', text: fmt.pct(projection.voteShare[p.id], 1) }),
            ]);
          })
        ),
        el('div', { class: 'sub-head', text: 'How the map breaks down' }),
        el('div', { class: 'band-grid' }, [
          bandBox('Safe', projection.playerBands.safe, 'safe'),
          bandBox('Likely', projection.playerBands.likely, 'likely'),
          bandBox('Lean', projection.playerBands.lean, 'lean'),
          bandBox('Toss-ups', projection.bands.tossup, 'tossup'),
        ]),
        el('p', {
          class: 'muted-note',
          text:
            'Safe, Likely and Lean count seats you are ahead in. Toss-ups are every seat still genuinely open — to anyone.',
        }),
        el('div', { class: 'sub-head', text: 'By region' }),
        el('div', { class: 'table-wrap' }, [
          el('table', { class: 'data-table' }, [
            el('thead', {}, [
              el('tr', {}, [
                el('th', { class: 'ta-left', text: 'Region' }),
                el('th', { text: 'Seats' }),
                el('th', { text: 'You' }),
                el('th', { text: 'Competitive' }),
              ]),
            ]),
            el(
              'tbody',
              {},
              regionRows.map(function (r) {
                return el('tr', {}, [
                  el('td', { class: 'ta-left', text: r.name }),
                  el('td', { text: r.seats }),
                  el('td', { class: 'dt-you', text: r.mine }),
                  el('td', { text: r.comp }),
                ]);
              })
            ),
          ]),
        ]),
      ];
    }

    function bandBox(label, value, cls) {
      return el('div', { class: 'band-box rating-' + cls }, [
        el('span', { class: 'band-value', text: value }),
        el('span', { class: 'band-label', text: label }),
      ]);
    }

    /* ------------------------------------------------------ render */

    function render() {
      if (!game) return;
      var content;
      if (tab === 'target') content = targetTab();
      else if (tab === 'districts') content = districtsTab();
      else if (tab === 'briefing') content = briefingTab();
      else content = standingsTab();
      mount(body, content);
      body.scrollTop = body.scrollTop; // keep position stable on re-render
    }

    function update(nextGame, nextProjection, nextSelection) {
      game = nextGame;
      projection = nextProjection;
      selection = nextSelection;
      render();
    }

    setTab('target');

    return {
      root: root,
      update: update,
      setTab: setTab,
      getTab: function () {
        return tab;
      },
      clearPending: function () {
        pendingAction = null;
      },
    };
  }

  return { create: create, strengthFor: strengthFor };
})();


/* ===== src/ui/setup.js ===== */
/**
 * Setup screen (Phase 1).
 * ------------------------------------------------------------------
 * Party, candidate, opening strategy, difficulty. Nothing here knows any
 * party or strategy by name -- it renders whatever the data files declare.
 */
window.PG = window.PG || {};
PG.ui = PG.ui || {};

PG.ui.setup = (function () {
  'use strict';

  var el = PG.ui.dom.el;
  var mount = PG.ui.dom.mount;
  var fmt = PG.ui.fmt;

  function create(opts) {
    var stateDef = PG.getState(opts.stateId || PG.DEFAULT_STATE);
    var choice = {
      partyId: PG.PLAYABLE_PARTIES[0].id,
      candidateName: '',
      slogan: '',
      strategyId: PG.STRATEGIES[0].id,
      difficulty: 'normal',
    };

    var root = el('div', { class: 'setup-screen' });

    function partyCard(p) {
      var on = choice.partyId === p.id;
      return el(
        'button',
        {
          class: 'party-card' + (on ? ' is-active' : ''),
          type: 'button',
          style: { '--party': p.colour },
          onclick: function () {
            choice.partyId = p.id;
            if (!choice.slogan) choice.slogan = '';
            render();
          },
        },
        [
          el('span', { class: 'party-flag' }, [el('span', { class: 'party-mark', text: p.short })]),
          el('span', { class: 'party-body' }, [
            el('strong', { class: 'party-name', text: p.name }),
            el('span', { class: 'party-tag', text: p.tagline }),
            el('span', { class: 'party-trait' }, [
              el('span', { class: 'trait-label', text: p.trait.label }),
              el('span', { class: 'trait-blurb', text: p.trait.blurb }),
            ]),
          ]),
        ]
      );
    }

    function strategyCard(s) {
      var on = choice.strategyId === s.id;
      return el(
        'button',
        {
          class: 'choice-card' + (on ? ' is-active' : ''),
          type: 'button',
          onclick: function () {
            choice.strategyId = s.id;
            render();
          },
        },
        [
          el('span', { class: 'choice-icon', text: s.icon }),
          el('span', { class: 'choice-body' }, [
            el('strong', { text: s.label }),
            el('span', { class: 'choice-blurb', text: s.blurb }),
            el('span', { class: 'choice-detail', text: s.detail }),
          ]),
        ]
      );
    }

    function difficultyCard(d) {
      var on = choice.difficulty === d.id;
      return el(
        'button',
        {
          class: 'choice-card choice-card-slim' + (on ? ' is-active' : ''),
          type: 'button',
          onclick: function () {
            choice.difficulty = d.id;
            render();
          },
        },
        [
          el('span', { class: 'choice-body' }, [
            el('strong', { text: d.label }),
            el('span', { class: 'choice-blurb', text: d.blurb }),
            el('span', {
              class: 'choice-detail',
              text: 'Purse: ' + stateDef.currency.symbol + d.budget + ' ' + stateDef.currency.unit,
            }),
          ]),
        ]
      );
    }

    function render() {
      var party = PG.PARTY_BY_ID[choice.partyId];
      var saves = PG.storage.list();
      var majority = stateDef.majority(stateDef.totalSeats);

      mount(root, [
        el('div', { class: 'setup-inner' }, [
          el('header', { class: 'setup-head' }, [
            el('span', { class: 'setup-kicker', text: stateDef.electionName }),
            el('h1', { class: 'setup-title' }, [
              'Become the ',
              el('span', { class: 'accent', text: stateDef.officeShort }),
              ' of ' + stateDef.name,
            ]),
            el('p', { class: 'setup-lede' }, [
              stateDef.totalSeats +
                ' assembly constituencies. Ten weeks. One purse. Win ' +
                majority +
                ' seats and you form the government.',
            ]),
            el('p', { class: 'setup-disclaimer' }, [
              'A fictional strategy game. The constituency names, numbers and districts are real; ',
              'the parties, candidates and all political support are invented.',
            ]),
          ]),

          saves.length
            ? el('section', { class: 'setup-section setup-continue' }, [
                el('h2', { class: 'setup-h2', text: 'Continue' }),
                el(
                  'div',
                  { class: 'save-list' },
                  saves.map(function (m) {
                    return el('div', { class: 'save-row' }, [
                      el('span', { class: 'save-dot', style: { background: m.colour } }),
                      el('span', { class: 'save-main' }, [
                        el('strong', { text: m.candidate + ' · ' + m.party }),
                        el('span', {
                          class: 'save-sub',
                          text:
                            (m.status === 'results'
                              ? 'Result declared'
                              : 'Week ' + m.turn + ' of ' + m.turns) +
                            (m.seats !== null && m.seats !== undefined
                              ? ' · projected ' + m.seats + ' seats'
                              : '') +
                            ' · ' + m.slot,
                        }),
                      ]),
                      el('button', {
                        class: 'btn btn-small',
                        type: 'button',
                        text: 'Resume',
                        onclick: function () {
                          opts.onLoad(m.slot);
                        },
                      }),
                      el('button', {
                        class: 'btn btn-ghost btn-small',
                        type: 'button',
                        text: 'Delete',
                        onclick: function () {
                          PG.storage.remove(m.slot);
                          render();
                        },
                      }),
                    ]);
                  })
                ),
              ])
            : null,

          el('section', { class: 'setup-section' }, [
            el('h2', { class: 'setup-h2', text: '1. Choose your party' }),
            el('div', { class: 'party-grid' }, PG.PLAYABLE_PARTIES.map(partyCard)),
          ]),

          el('section', { class: 'setup-section' }, [
            el('h2', { class: 'setup-h2', text: '2. Your candidature' }),
            el('div', { class: 'field-row' }, [
              el('label', { class: 'field' }, [
                el('span', { class: 'field-label', text: 'Candidate name' }),
                el('input', {
                  class: 'field-input',
                  type: 'text',
                  maxlength: '40',
                  value: choice.candidateName,
                  placeholder: 'e.g. Harleen Kaur Sandhu',
                  oninput: function (e) {
                    choice.candidateName = e.target.value;
                    var btn = root.querySelector('.setup-start');
                    if (btn) btn.disabled = false;
                  },
                }),
              ]),
              el('label', { class: 'field' }, [
                el('span', { class: 'field-label', text: 'Campaign slogan' }),
                el('input', {
                  class: 'field-input',
                  type: 'text',
                  maxlength: '48',
                  value: choice.slogan,
                  placeholder: party.slogan,
                  oninput: function (e) {
                    choice.slogan = e.target.value;
                  },
                }),
              ]),
            ]),
          ]),

          el('section', { class: 'setup-section' }, [
            el('h2', { class: 'setup-h2', text: '3. Opening strategy' }),
            el('div', { class: 'choice-grid' }, PG.STRATEGIES.map(strategyCard)),
          ]),

          el('section', { class: 'setup-section' }, [
            el('h2', { class: 'setup-h2', text: '4. Difficulty' }),
            el(
              'div',
              { class: 'choice-grid choice-grid-3' },
              Object.keys(stateDef.difficulties).map(function (k) {
                return difficultyCard(stateDef.difficulties[k]);
              })
            ),
          ]),

          el('footer', { class: 'setup-foot' }, [
            el('div', { class: 'setup-summary' }, [
              el('span', { class: 'summary-dot', style: { background: party.colour } }),
              el('span', {
                text:
                  (choice.candidateName || 'Your candidate') +
                  ' · ' +
                  party.short +
                  ' · ' +
                  PG.STRATEGY_BY_ID[choice.strategyId].label +
                  ' · ' +
                  stateDef.difficulties[choice.difficulty].label,
              }),
            ]),
            el('button', {
              class: 'btn btn-primary btn-large setup-start',
              type: 'button',
              text: 'Launch the campaign',
              onclick: function () {
                opts.onStart({
                  stateId: stateDef.id,
                  partyId: choice.partyId,
                  candidateName: choice.candidateName,
                  slogan: choice.slogan,
                  strategyId: choice.strategyId,
                  difficulty: choice.difficulty,
                });
              },
            }),
          ]),
        ]),
      ]);
    }

    render();
    return { root: root, render: render };
  }

  return { create: create };
})();


/* ===== src/ui/results.js ===== */
/**
 * Results (Phase 6).
 * ------------------------------------------------------------------
 * An overlay over the map, which by then is showing the declared result seat
 * by seat. The headline answers one question first -- did you form the
 * government -- and only then breaks the numbers down.
 */
window.PG = window.PG || {};
PG.ui = PG.ui || {};

PG.ui.results = (function () {
  'use strict';

  var el = PG.ui.dom.el;
  var mount = PG.ui.dom.mount;
  var fmt = PG.ui.fmt;

  var HEADLINES = {
    majority: {
      kicker: 'Majority won',
      verdict: 'Government formed',
      tone: 'win',
    },
    coalition: {
      kicker: 'Hung assembly',
      verdict: 'Government formed',
      tone: 'win',
    },
    hung: {
      kicker: 'Hung assembly',
      verdict: 'Government not formed',
      tone: 'lose',
    },
    defeat: {
      kicker: 'Defeat',
      verdict: 'Government not formed',
      tone: 'lose',
    },
  };

  function create(opts) {
    var root = el('div', { class: 'results-overlay', 'aria-hidden': 'true' });

    function seatBar(result, playerId) {
      var total = result.total;
      var segments = result.standings.filter(function (s) {
        return s.seats > 0;
      });
      return el('div', { class: 'result-bar-wrap' }, [
        el(
          'div',
          { class: 'result-bar' },
          segments.map(function (s) {
            var p = PG.PARTY_BY_ID[s.id];
            return el('span', {
              class: 'result-seg' + (s.id === playerId ? ' is-you' : ''),
              style: { width: (s.seats / total) * 100 + '%', background: p.colour },
              title: p.name + ': ' + s.seats,
            });
          })
        ),
        el('span', {
          class: 'result-majority-line',
          style: { left: (result.majority / total) * 100 + '%' },
        }),
        el('span', {
          class: 'result-majority-label',
          style: { left: (result.majority / total) * 100 + '%' },
          text: 'Majority ' + result.majority,
        }),
      ]);
    }

    function render(game) {
      var result = game.result;
      if (!result) return;
      var stateDef = PG.getState(game.stateId);
      var playerId = game.player.partyId;
      var party = PG.PARTY_BY_ID[playerId];
      var head = HEADLINES[result.outcome];
      var mine = result.standings.filter(function (s) {
        return s.id === playerId;
      })[0];

      mount(root, [
        el('div', { class: 'results-card tone-' + head.tone }, [
          el('div', { class: 'results-head' }, [
            el('span', { class: 'results-kicker', text: stateDef.electionName }),
            el('h1', { class: 'results-verdict', text: head.verdict }),
            el('p', { class: 'results-line' }, [
              result.total + ' seats · majority ' + result.majority + ' · ',
              el('strong', { text: head.kicker }),
            ]),
          ]),

          result.governmentFormed
            ? el('div', { class: 'results-office' }, [
                el('span', { class: 'office-label', text: 'Sworn in as' }),
                el('span', { class: 'office-title', text: stateDef.office }),
                el('span', { class: 'office-name', text: game.player.name }),
                el('span', { class: 'office-party', style: { color: party.colour }, text: party.name }),
                result.coalition
                  ? el('span', {
                      class: 'office-note',
                      text:
                        'In coalition with ' +
                        PG.PARTY_BY_ID[result.coalition.partnerId].name +
                        ' — ' +
                        result.coalition.total +
                        ' seats together.',
                    })
                  : null,
              ])
            : el('div', { class: 'results-office is-lost' }, [
                el('span', { class: 'office-label', text: 'You finish on' }),
                el('span', { class: 'office-title', text: result.playerSeats + ' seats' }),
                el('span', {
                  class: 'office-note',
                  text:
                    result.playerSeats >= result.majority
                      ? ''
                      : Math.max(0, result.majority - result.playerSeats) +
                        ' short of the ' +
                        result.majority +
                        ' needed to form a government.',
                }),
              ]),

          seatBar(result, playerId),

          el('div', { class: 'table-wrap results-table-wrap' }, [
            el('table', { class: 'data-table results-table' }, [
              el('thead', {}, [
                el('tr', {}, [
                  el('th', { class: 'ta-left', text: 'Party' }),
                  el('th', { text: 'Seats' }),
                  el('th', { text: 'Change' }),
                  el('th', { text: 'Vote share' }),
                ]),
              ]),
              el(
                'tbody',
                {},
                result.standings.map(function (s) {
                  var p = PG.PARTY_BY_ID[s.id];
                  return el('tr', { class: s.id === playerId ? 'is-you' : '' }, [
                    el('td', { class: 'ta-left' }, [
                      el('span', { class: 'standing-dot', style: { background: p.colour } }),
                      el('span', { text: p.name }),
                    ]),
                    el('td', { class: 'num-strong', text: s.seats }),
                    el('td', {
                      class: s.change > 0 ? 'delta-up' : s.change < 0 ? 'delta-down' : 'delta-flat',
                      text: s.change === 0 ? '—' : fmt.signed(s.change),
                    }),
                    el('td', { text: fmt.pct(s.voteShare, 1) }),
                  ]);
                })
              ),
            ]),
          ]),

          el('div', { class: 'results-stats' }, [
            stat('Seats won', mine.seats + ' of ' + result.total),
            stat('Vote share', fmt.pct(mine.voteShare, 1)),
            stat('Change', mine.change === 0 ? 'no change' : fmt.signed(mine.change) + ' seats'),
            stat('Spent', fmt.money(game, result.spent) + ' of ' + fmt.money(game, result.budget)),
          ]),

          el('div', { class: 'results-actions' }, [
            el('button', {
              class: 'btn btn-primary',
              type: 'button',
              text: 'Play again',
              onclick: function () {
                hide();
                opts.onRestart();
              },
            }),
            el('button', {
              class: 'btn',
              type: 'button',
              text: 'Review the map',
              onclick: hide,
            }),
          ]),
        ]),
      ]);
    }

    function stat(label, value) {
      return el('div', { class: 'results-stat' }, [
        el('span', { class: 'results-stat-label', text: label }),
        el('span', { class: 'results-stat-value', text: value }),
      ]);
    }

    function show(game) {
      render(game);
      root.classList.add('is-visible');
      root.setAttribute('aria-hidden', 'false');
    }

    function hide() {
      root.classList.remove('is-visible');
      root.setAttribute('aria-hidden', 'true');
    }

    return { root: root, show: show, hide: hide, render: render };
  }

  return { create: create };
})();


/* ===== src/ui/app.js ===== */
/**
 * Application shell.
 * ------------------------------------------------------------------
 * Routes between the setup screen and the campaign screen, owns the current
 * game object, and is the only place that calls both the engine and the
 * renderers. Engine code never reaches into here.
 */
window.PG = window.PG || {};
PG.ui = PG.ui || {};

PG.ui.app = (function () {
  'use strict';

  var el = PG.ui.dom.el;
  var mount = PG.ui.dom.mount;
  var fmt = PG.ui.fmt;

  function start(rootNode) {
    var game = null;
    var projection = null;
    var selection = { seat: null, district: null, region: null };
    var map = null;
    var hud = null;
    var panel = null;
    var results = null;
    var dock = null;
    var toastHost = el('div', { class: 'toast-host' });
    var screen = el('div', { class: 'screen' });

    mount(rootNode, [screen, toastHost]);

    /* --------------------------------------------------------- toasts */

    function toast(o) {
      var node = el('div', { class: 'toast tone-' + (o.tone || 'neutral') }, [
        o.title ? el('strong', { text: o.title }) : null,
        el('span', { text: o.text }),
      ]);
      toastHost.appendChild(node);
      window.setTimeout(function () {
        node.classList.add('is-out');
        window.setTimeout(function () {
          if (node.parentNode) node.parentNode.removeChild(node);
        }, 320);
      }, o.tone === 'bad' ? 3200 : 2400);
    }

    /* --------------------------------------------------------- routing */

    function showSetup() {
      game = null;
      var view = PG.ui.setup.create({
        stateId: PG.DEFAULT_STATE,
        onStart: function (choice) {
          beginGame(PG.engine.newGame(choice));
        },
        onLoad: function (slot) {
          var loaded = PG.storage.load(slot);
          if (!loaded) {
            toast({ tone: 'bad', text: 'That save could not be read.' });
            return;
          }
          beginGame(loaded);
        },
      });
      mount(screen, [view.root]);
      document.body.dataset.screen = 'setup';
    }

    function beginGame(next) {
      game = next;
      selection = { seat: null, district: null, region: null };
      buildGameScreen();
      if (game.status === 'results') {
        refresh();
        results.show(game);
      } else {
        refresh();
      }
    }

    /* --------------------------------------------------------- game screen */

    function buildGameScreen() {
      hud = PG.ui.hud.create({
        onMenu: openMenu,
        onSave: function () {
          quickSave(true);
        },
      });

      map = PG.ui.map.create({
        stateId: game.stateId,
        onSelect: function (num) {
          selectSeat(num);
        },
        onDistrict: function (name) {
          selectDistrict(name, { zoom: false });
        },
      });

      panel = PG.ui.panel.create({
        onSelectSeat: selectSeat,
        onSelectDistrict: function (name) {
          selectDistrict(name);
        },
        onAction: onAction,
        onToast: toast,
      });

      results = PG.ui.results.create({
        onRestart: function () {
          showSetup();
        },
      });

      dock = buildDock();

      var mapPane = el('section', { class: 'map-pane' }, [
        buildMapToolbar(),
        map.root,
        buildLegend(),
      ]);

      mount(screen, [
        hud.root,
        el('main', { class: 'game-main' }, [mapPane, panel.root]),
        dock.root,
        results.root,
      ]);
      document.body.dataset.screen = 'game';
    }

    /* --------------------------------------------------------- toolbar */

    var toolbarButtons = {};

    function toggleGroup(name, items, current, onPick) {
      var group = el(
        'div',
        { class: 'toggle-group', role: 'group', 'aria-label': name },
        items.map(function (item) {
          var b = el('button', {
            class: 'toggle' + (item.id === current ? ' is-active' : ''),
            type: 'button',
            text: item.label,
            title: item.title || item.label,
            onclick: function () {
              onPick(item.id);
              Array.prototype.forEach.call(group.children, function (c) {
                c.classList.toggle('is-active', c === b);
              });
            },
