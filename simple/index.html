<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Chief Minister of Punjab</title>
    <meta
      name="description"
      content="A fictional election strategy game. Choose a party, name your Chief Minister candidate, set your budget and contest all 117 Punjab assembly constituencies."
    />
    <meta name="theme-color" content="#14110d" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/tokens.css" />
    <link rel="stylesheet" href="css/campaign.css" />
    <link rel="stylesheet" href="css/systems.css" />
    <link rel="stylesheet" href="css/rounds.css" />
    <link rel="stylesheet" href="css/scoreboard.css" />
    <link rel="stylesheet" href="css/game.css" />
    <link rel="stylesheet" href="css/home.css" />
    <link rel="stylesheet" href="css/menu.css" />
    <link rel="stylesheet" href="css/play.css" />
    <link rel="stylesheet" href="css/territory.css" />
    <link rel="stylesheet" href="css/hud.css" />
    <link rel="stylesheet" href="css/landing.css" />
    <link rel="stylesheet" href="css/areas.css" />
    <link rel="stylesheet" href="css/map.css" />

    <!-- Portrait phones, last so it wins. -->
    <link rel="stylesheet" href="css/mobile.css" />
  </head>
  <body>
    <div id="app"></div>

    <!-- Data -->
    <!-- Parties and campaign actions are small and the home screen shows
         them. The 117 constituencies, the sitting MLAs and the map are the
         bulk of the download and no part of the opening screen, so they are
         fetched by js/data/loader.js when a game actually starts. -->
    <script src="js/data/parties.js"></script>
    <script src="js/data/actions.js"></script>
    <script src="js/data/loader.js"></script>

    <!-- Engine: campaign rules and randomness, no DOM -->
    <script src="js/engine/rng.js"></script>
    <script src="js/engine/campaign.js"></script>
    <script src="js/engine/ai.js"></script>

    <!-- Game state and persistence -->
    <script src="js/state.js"></script>
    <script src="js/storage.js"></script>
    <script src="js/net.js"></script>
    <script src="js/profile.js"></script>

    <!-- UI -->
    <script src="js/ui/dom.js"></script>
    <script src="js/ui/home.js"></script>
    <script src="js/ui/profile.js"></script>
    <script src="js/ui/setup.js"></script>
    <script src="js/ui/multiplayer.js"></script>
    <script src="js/ui/lobby.js"></script>
    <script src="js/ui/portrait.js"></script>
    <script src="js/ui/avatars.js"></script>
    <script src="js/ui/round.js"></script>
    <script src="js/ui/scoreboard.js"></script>
    <script src="js/ui/seats.js"></script>
    <script src="js/ui/areas.js"></script>
    <script src="js/ui/areas-v2.js"></script>
    <script src="js/ui/campaign-sheet.js"></script>
    <script src="js/ui/allocate.js"></script>
    <script src="js/ui/territory.js"></script>
    <script src="js/ui/constituency.js"></script>
    <script src="js/ui/map.js"></script>
    <script src="js/ui/oversight.js"></script>
    <script src="js/ui/election.js"></script>
    <script src="js/ui/result.js"></script>

    <!-- Boot -->
    <script src="js/app.js"></script>
  </body>
</html>
